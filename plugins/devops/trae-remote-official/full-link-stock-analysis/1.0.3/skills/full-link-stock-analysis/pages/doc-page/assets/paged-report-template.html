<body data-theme="{{REPORT_THEME}}">

  <main id="source" class="doc-flow" aria-hidden="true">
    <!--
      Compose this source as the document requires; this starter block only demonstrates
      the continuous #source structure used by the paginator.
    -->

      <h1>{{REPORT_TITLE}}</h1>
      <hr class="title-rule">
      <p class="lead">{{OPENING_PARAGRAPH}}</p>
    </section>

  <nav class="viewer-tools" aria-label="预览缩放">

    <output id="zoom-value" aria-live="polite">100%</output>
    <button type="button" data-zoom="in" title="放大" aria-label="放大">+</button>
    <button type="button" data-zoom="reset" title="适合宽度" aria-label="适合宽度">↺</button>
  </nav>
  <div id="pages" aria-label="分页文档"></div>

  <script>
    (() => {
      const BASE_WIDTH = 794;
      const BASE_HEIGHT = 1123;
      const SIDE_GAP = 28;
      const MIN_SCALE = 0.58;
      const MAX_SCALE = 1.28;
      const TWO_COLUMN_SCALE = 0.74;
      const source = document.getElementById("source");
      const coverSource = document.getElementById("cover-source");
      const pages = document.getElementById("pages");
      const viewerTools = document.querySelector(".viewer-tools");
      const zoomValue = document.getElementById("zoom-value");
      let userScale = null;
      let zoomToolsTimer = 0;

      function hasCover() {
        return Boolean(coverSource?.classList.contains("has-cover") && coverSource.innerHTML.trim());
      }

      function createCover() {
        if (!hasCover()) return;
        const frame = document.createElement("div");
        frame.className = "page-frame cover-frame";
        const page = document.createElement("article");
        page.className = "page";
        page.innerHTML = coverSource.innerHTML;
        frame.appendChild(page);
        pages.appendChild(frame);
      }

      function createPage(index) {
        const frame = document.createElement("div");
        frame.className = "page-frame";
        const page = document.createElement("article");
        page.className = "page";
        const content = document.createElement("div");
        content.className = "page-content";
        const slice = document.createElement("div");
        slice.className = "doc-flow column-flow page-slice";
        slice.style.setProperty("--slice-index", index);
        slice.innerHTML = source.innerHTML;
        const folio = document.createElement("div");
        folio.className = "folio";
        folio.textContent = String(index + 1);
        content.appendChild(slice);
        page.append(content, folio);
        frame.appendChild(page);
        pages.appendChild(frame);
      }

      function createMeasure() {
        const measure = document.createElement("div");
        measure.className = "doc-flow column-flow measure-flow";
        measure.innerHTML = source.innerHTML;
        document.body.appendChild(measure);
        return measure;
      }

      function pageCountFor(measure) {
        const contentHeight = document.querySelector(".page-content")?.clientHeight || measure.clientHeight;
        const sourceHeight = source.scrollHeight;
        return Math.max(1, Math.ceil(sourceHeight / contentHeight));
      }

      function paginate() {
        pages.innerHTML = "";
        createCover();
        const measure = createMeasure();
        const count = pageCountFor(measure);
        measure.remove();
        for (let index = 0; index < count; index += 1) createPage(index);
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function fitScale() {
        return Math.min(1, Math.max(MIN_SCALE, (window.innerWidth - SIDE_GAP) / BASE_WIDTH));
      }

      function pageColumns(scale) {
        const twoColumnWidth = BASE_WIDTH * scale * 2 + 18 + SIDE_GAP;
        return scale <= TWO_COLUMN_SCALE && pages.children.length > 1 && window.innerWidth >= twoColumnWidth ? 2 : 1;
      }

      function applyScale(scale) {
        document.documentElement.style.setProperty("--page-scale", scale.toFixed(4));
        document.documentElement.style.setProperty("--page-columns", pageColumns(scale));
        document.querySelectorAll(".page-frame").forEach((frame) => {
          frame.style.width = `${BASE_WIDTH * scale}px`;
          frame.style.height = `${BASE_HEIGHT * scale}px`;
        });
        zoomValue.textContent = `${Math.round(scale * 100)}%`;
      }

      function fitPages() {
        applyScale(userScale ?? fitScale());
      }

      function showZoomTools() {
        viewerTools.classList.add("is-visible");
        clearTimeout(zoomToolsTimer);
        zoomToolsTimer = setTimeout(() => {
          viewerTools.classList.remove("is-visible");
        }, 1050);
      }

      function zoomBy(delta) {
        const current = userScale ?? fitScale();
        userScale = clamp(current + delta, MIN_SCALE, MAX_SCALE);
        applyScale(userScale);
        showZoomTools();
      }

      function resetZoom() {
        userScale = null;
        fitPages();
        showZoomTools();
      }

      paginate();
      fitPages();
      window.addEventListener("resize", fitPages);
      window.addEventListener("wheel", (event) => {
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        zoomBy(event.deltaY > 0 ? -0.04 : 0.04);
      }, { passive: false });
      window.addEventListener("keydown", (event) => {
        if (!event.ctrlKey && !event.metaKey) return;
        if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          zoomBy(0.08);
        }
        if (event.key === "-" || event.key === "_") {
          event.preventDefault();
          zoomBy(-0.08);
        }
        if (event.key === "0") {
          event.preventDefault();
          resetZoom();
        }
      });
      viewerTools.addEventListener("click", (event) => {
        const action = event.target?.dataset?.zoom;
        if (action === "in") zoomBy(0.08);
        if (action === "out") zoomBy(-0.08);
        if (action === "reset") resetZoom();
        event.target?.blur?.();
      });
      window.addEventListener("beforeprint", () => {
        document.documentElement.style.setProperty("--page-scale", "1");
        document.documentElement.style.setProperty("--page-columns", "1");
        document.querySelectorAll(".page-frame").forEach((frame) => {
          frame.style.width = "";
          frame.style.height = "";
        });
      });
      window.addEventListener("afterprint", fitPages);
    })();
  </script>
