<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sculpted ecommerce performance bars</title>
  <desc id="desc">Four dimensional bars and an orbit line represent a changing commercial trajectory.</desc>
  <defs>
    <linearGradient id="lime" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#B7FF16"/>
      <stop offset="1" stop-color="#88D600"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#91ED93"/>
      <stop offset="1" stop-color="#63C877"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6FC8C4"/>
      <stop offset="1" stop-color="#2F9D9A"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F7F8F5"/>
      <stop offset="1" stop-color="#E5E8E3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#44524D" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="64" fill="#FFFFFF"/>
  <ellipse cx="700" cy="644" rx="410" ry="28" fill="#43534D" opacity=".09"/>
  <g filter="url(#soft)">
    <rect x="250" y="352" width="156" height="238" rx="20" fill="url(#lime)"/>
    <rect x="438" y="284" width="156" height="306" rx="20" fill="url(#ivory)"/>
    <rect x="626" y="122" width="156" height="468" rx="20" fill="url(#mint)"/>
    <rect x="814" y="228" width="156" height="362" rx="20" fill="url(#teal)"/>
  </g>
  <path d="M130 510C220 215 375 230 526 364S784 520 1036 104" fill="none" stroke="#087F79" stroke-width="7" stroke-linecap="round"/>
  <g fill="#087F79">
    <rect x="108" y="488" width="44" height="44" rx="12"/>
    <rect x="504" y="342" width="44" height="44" rx="12"/>
    <rect x="1014" y="82" width="44" height="44" rx="12"/>
  </g>
</svg>
