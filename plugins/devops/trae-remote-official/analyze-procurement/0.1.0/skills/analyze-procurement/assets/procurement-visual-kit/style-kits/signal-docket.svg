<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Signal Docket support kit</title>
  <desc id="desc">Original vermilion docket stamps, document pattern, approval field, and threshold chart marks.</desc>
  <defs>
    <pattern id="route-pattern" width="32" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 17.5H32" stroke="#201918" stroke-opacity=".16"/>
    </pattern>
    <g id="route-marker"><rect width="18" height="18" fill="#A23A2B"/><path d="M4 9h10" stroke="#FFFFFF" stroke-width="2"/></g>
    <g id="route-chart-mark"><path d="M0 30V8M18 30V16M36 30V3" stroke="#A23A2B" stroke-width="8"/><path d="M-4 12h48" stroke="#D39B36" stroke-width="2" stroke-dasharray="4 3"/></g>
  </defs>
  <rect width="320" height="180" fill="#FFFFFF"/>
  <rect x="16" y="16" width="132" height="72" fill="url(#route-pattern)"/>
  <rect id="route-focus-field" x="164" y="16" width="140" height="72" fill="#A23A2B"/>
  <rect x="180" y="34" width="88" height="8" fill="#FFFFFF"/><rect x="180" y="52" width="60" height="5" fill="#FFFFFF" opacity=".7"/>
  <g transform="translate(16 116)"><use href="#route-marker"/></g>
  <g transform="translate(244 118)"><use href="#route-chart-mark"/></g>
</svg>
