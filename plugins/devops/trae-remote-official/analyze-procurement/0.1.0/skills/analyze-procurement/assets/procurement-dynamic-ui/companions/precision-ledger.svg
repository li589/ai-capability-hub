<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Precision Ledger Dynamic UI companion</title>
  <desc id="desc">Six compact procurement widget composition references for award, price, risk, inventory, logistics, and execution.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.panel{fill:#f7f8fa;stroke:#d8dce3}.ink{fill:#172033}.muted{fill:#687083}.rule{stroke:#d8dce3;fill:none}.main{fill:#2856a3}.signal{fill:#c44d32}.main-stroke{stroke:#2856a3;fill:none}.signal-stroke{stroke:#c44d32;fill:none}.label{font:600 11px Arial,sans-serif;letter-spacing:1.2px}.meta{font:400 9px Arial,sans-serif}.num{font:700 18px Arial,sans-serif}.tiny{font:600 8px Arial,sans-serif;letter-spacing:.7px}.dash{stroke-dasharray:4 4}
    </style>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" class="rule" stroke-width=".6"/></pattern>
  </defs>
  <rect class="bg" width="960" height="720"/>
  <text x="24" y="28" class="ink label">PRECISION LEDGER / DYNAMIC UI COMPOSITION PLATE</text>
  <text x="936" y="28" text-anchor="end" class="muted meta">SYSTEM MATERIAL FIRST · COMPOSITION ONLY</text>

  <g transform="translate(24 54)">
    <rect class="panel" width="444" height="190" rx="3"/>
    <text x="18" y="24" class="ink label">01 · AWARD FRONTIER</text><text x="426" y="24" text-anchor="end" class="muted meta">SCATTER + REGISTER</text>
    <rect x="18" y="38" width="270" height="130" fill="url(#grid)"/>
    <path d="M36 146L84 131L128 118L178 92L228 69L270 53" class="main-stroke" stroke-width="2"/>
    <circle cx="84" cy="131" r="5" class="ink"/><circle cx="128" cy="118" r="5" class="ink"/><circle cx="178" cy="92" r="5" class="ink"/><circle cx="228" cy="69" r="7" class="main"/>
    <rect x="298" y="42" width="126" height="22" class="main" rx="2"/><text x="361" y="56" text-anchor="middle" fill="#fff" class="tiny">LOCKED / S03</text>
    <path d="M298 80H424M298 105H424M298 130H424M298 155H424" class="rule"/>
    <text x="300" y="76" class="muted meta">RANK</text><text x="420" y="76" text-anchor="end" class="ink meta">COST / CAP.</text>
    <text x="300" y="97" class="ink meta">01 SUPPLIER C</text><text x="420" y="97" text-anchor="end" class="ink meta">8.7 / 92</text>
    <text x="300" y="122" class="ink meta">02 SUPPLIER A</text><text x="420" y="122" text-anchor="end" class="ink meta">8.3 / 86</text>
    <text x="300" y="147" class="ink meta">03 SUPPLIER B</text><text x="420" y="147" text-anchor="end" class="ink meta">7.9 / 79</text>
  </g>

  <g transform="translate(492 54)">
    <rect class="panel" width="444" height="190" rx="3"/>
    <text x="18" y="24" class="ink label">02 · PRICE PULSE</text><text x="426" y="24" text-anchor="end" class="muted meta">TREND + DRIVER STRIP</text>
    <path d="M28 72H416M28 108H416M28 144H416" class="rule"/>
    <path d="M30 138C76 130 92 98 132 105S194 121 234 81S302 68 340 83S385 58 414 50" class="main-stroke" stroke-width="2.5"/>
    <circle cx="234" cy="81" r="5" class="main"/><circle cx="414" cy="50" r="5" class="signal"/>
    <rect x="30" y="154" width="92" height="14" class="main"/><rect x="130" y="154" width="64" height="14" fill="#9fb2d4"/><rect x="202" y="154" width="132" height="14" class="ink"/><rect x="342" y="154" width="72" height="14" class="signal"/>
    <text x="30" y="184" class="muted meta">INDEX</text><text x="414" y="184" text-anchor="end" class="ink meta">VOLUME · MIX · FX · TERM</text>
  </g>

  <g transform="translate(24 274)">
