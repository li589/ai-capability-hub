    <text x="302" y="67" class="ink meta">SECURITY</text><text x="424" y="67" text-anchor="end" class="ink meta">OBS</text>
    <text x="302" y="95" class="ink meta">CAPACITY</text><text x="424" y="95" text-anchor="end" class="main meta">DRV</text>
    <text x="302" y="123" class="ink meta">RESILIENCE</text><text x="424" y="123" text-anchor="end" class="signal meta">UNK</text>
  </g>

  <g transform="translate(492 274)">
    <rect class="panel" width="444" height="190" rx="3"/>
    <text x="18" y="24" class="ink label">04 · EXCEPTION QUEUE</text><text x="426" y="24" text-anchor="end" class="muted meta">RANK + DATE</text>
    <path d="M18 48H426M18 84H426M18 120H426M18 156H426" class="rule"/>
    <circle cx="34" cy="66" r="5" class="signal"/><circle cx="34" cy="102" r="5" class="main"/><circle cx="34" cy="138" r="5" class="ink"/>
    <text x="50" y="69" class="ink meta">ITEM 014 · COVERAGE</text><text x="300" y="69" class="muted meta">OWNER A</text><text x="422" y="69" text-anchor="end" class="signal meta">02 AUG</text>
    <text x="50" y="105" class="ink meta">ITEM 022 · DELAY</text><text x="300" y="105" class="muted meta">OWNER B</text><text x="422" y="105" text-anchor="end" class="ink meta">05 AUG</text>
    <text x="50" y="141" class="ink meta">ITEM 031 · MOQ</text><text x="300" y="141" class="muted meta">OWNER C</text><text x="422" y="141" text-anchor="end" class="ink meta">09 AUG</text>
    <rect x="18" y="166" width="104" height="12" class="signal"/><rect x="130" y="166" width="156" height="12" class="main"/><rect x="294" y="166" width="128" height="12" class="ink"/>
  </g>

  <g transform="translate(24 494)">
    <rect class="panel" width="444" height="190" rx="3"/>
