    <circle cx="46" cy="104" r="14" fill="#fff" stroke="#2856a3" stroke-width="2"/><circle cx="205" cy="70" r="14" fill="#fff" stroke="#172033"/><circle cx="205" cy="138" r="14" fill="#fff" stroke="#172033"/><circle cx="366" cy="104" r="16" class="main"/>
    <path d="M60 98C112 80 146 70 191 70M60 110C112 126 146 138 191 138M219 70C274 72 306 86 350 100M219 138C274 136 306 122 350 108" class="main-stroke" stroke-width="2"/>
    <text x="46" y="108" text-anchor="middle" class="ink tiny">SRC</text><text x="205" y="74" text-anchor="middle" class="ink tiny">SEA</text><text x="205" y="142" text-anchor="middle" class="ink tiny">AIR</text><text x="366" y="108" text-anchor="middle" fill="#fff" class="tiny">DC</text>
    <text x="18" y="174" class="muted meta">BASE 62%</text><text x="144" y="174" class="ink meta">FREIGHT 21%</text><text x="290" y="174" class="signal meta">DUTY 17%</text>
  </g>

  <g transform="translate(492 494)">
    <rect class="panel" width="444" height="190" rx="3"/>
    <text x="18" y="24" class="ink label">06 · EXECUTION TRACK</text><text x="426" y="24" text-anchor="end" class="muted meta">GATE + OWNER</text>
    <path d="M54 82H390" class="rule" stroke-width="2"/>
    <circle cx="64" cy="82" r="14" class="main"/><circle cx="176" cy="82" r="14" fill="#fff" stroke="#172033"/><circle cx="288" cy="82" r="14" fill="#fff" stroke="#172033"/><circle cx="400" cy="82" r="14" class="signal"/>
    <text x="64" y="86" text-anchor="middle" fill="#fff" class="tiny">01</text><text x="176" y="86" text-anchor="middle" class="ink tiny">02</text><text x="288" y="86" text-anchor="middle" class="ink tiny">03</text><text x="400" y="86" text-anchor="middle" fill="#fff" class="tiny">04</text>
    <text x="64" y="116" text-anchor="middle" class="ink meta">VERIFY</text><text x="176" y="116" text-anchor="middle" class="ink meta">PILOT</text><text x="288" y="116" text-anchor="middle" class="ink meta">AWARD</text><text x="400" y="116" text-anchor="middle" class="signal meta">REVIEW</text>
    <path d="M18 142H426M18 169H426" class="rule"/>
    <text x="20" y="160" class="muted meta">OWNER / DATE</text><text x="424" y="160" text-anchor="end" class="ink meta">PROCUREMENT · 14 AUG</text>
  </g>
</svg>
