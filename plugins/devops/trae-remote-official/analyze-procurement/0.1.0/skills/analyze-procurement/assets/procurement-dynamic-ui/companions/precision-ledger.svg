      <rect x="118" y="30" width="46" height="24" class="main"/><rect x="218" y="86" width="46" height="24" class="signal"/><rect x="168" y="58" width="46" height="24" fill="#9fb2d4"/>
      <text x="8" y="18" class="muted meta">GATE</text><text x="76" y="18" class="ink meta">A</text><text x="126" y="18" class="ink meta">B</text><text x="176" y="18" class="ink meta">C</text><text x="226" y="18" class="ink meta">D</text>
    </g>
    <path d="M300 48H426M300 76H426M300 104H426M300 132H426M300 160H426" class="rule"/>
