<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Acid Registry Dynamic UI companion</title>
  <desc id="desc">Six pure-white modular procurement widget layouts with chartreuse focus blocks and black comparison anchors.</desc>
  <defs>
