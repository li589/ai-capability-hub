<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Product Stage HTML style preview</title>
  <desc id="desc">A premium pure-white procurement decision stage with one electric-blue accent and named rounded objects.</desc>
  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect x="64" y="40" width="1472" height="264" rx="28" fill="#2B63E8"/>
  <g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif" fill="#FFFFFF">
    <text x="100" y="82" font-size="16" font-weight="600" letter-spacing="3">REFERENCE 07 / PRODUCT STAGE</text>
    <text x="100" y="176" font-size="62" font-weight="600">品类价格与采购窗口</text>
    <text x="100" y="236" font-size="24">一个主色 · 清楚的对象 · 用比例与留白建立层级</text>
  </g>
  <circle cx="1330" cy="170" r="90" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1292" y="190" font-family="Georgia,serif" font-size="72" fill="#FFFFFF">01</text>
  <g transform="translate(64 368)">
    <rect width="900" height="252" rx="28" fill="#162033"/>
    <g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif" fill="#FFFFFF">
      <text x="34" y="54" font-size="15" font-weight="600" letter-spacing="2">PRICE WINDOW</text>
      <text x="34" y="130" font-size="50" font-weight="600">9 月前锁定 60% 用量</text>
      <text x="34" y="182" font-size="21">现货回落，但 Q4 供应弹性不足。</text>
      <text x="34" y="220" font-size="16" fill="#FFFFFF" opacity=".72">月均价：¥ 3,246 / 吨 · 含税到厂 · 2026-07</text>
    </g>
    <rect x="938" width="534" height="252" rx="28" fill="#162033" opacity=".035"/>
    <g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif" fill="#162033">
      <text x="974" y="54" font-size="15" font-weight="600" letter-spacing="2">REVERSAL</text>
