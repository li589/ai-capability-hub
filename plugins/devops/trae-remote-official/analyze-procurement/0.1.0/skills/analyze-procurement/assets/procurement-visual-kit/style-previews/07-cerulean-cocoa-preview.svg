      <text x="974" y="163" font-size="21">或库存覆盖低于</text>
      <text x="974" y="216" font-size="42" font-weight="600">28 天</text>
    </g>
  </g>
  <g transform="translate(64 682)" font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif">
