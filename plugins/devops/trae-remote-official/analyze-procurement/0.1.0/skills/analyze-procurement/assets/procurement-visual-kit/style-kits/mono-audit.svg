<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Mono Audit support kit</title>
  <desc id="desc">Original monochrome audit markers, hatch pattern, inverse field, and outline chart marks.</desc>
  <defs>
    <pattern id="route-pattern" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0V10" stroke="#111111" stroke-width="2"/>
    </pattern>
    <g id="route-marker"><rect width="18" height="18" fill="#111111"/><circle cx="9" cy="9" r="3" fill="#FFFFFF"/></g>
    <g id="route-chart-mark"><rect width="10" height="30" fill="#111111"/><rect x="16" y="10" width="10" height="20" fill="none" stroke="#111111" stroke-width="2"/><rect x="32" y="4" width="10" height="26" fill="url(#route-pattern)"/></g>
  </defs>
  <rect width="320" height="180" fill="#FFFFFF"/>
  <rect x="16" y="16" width="132" height="72" fill="url(#route-pattern)" opacity=".24"/>
  <rect id="route-focus-field" x="164" y="16" width="140" height="72" fill="#111111"/>
  <path d="M180 38h100M180 54h68M180 70h88" stroke="#FFFFFF" stroke-width="3"/>
  <g transform="translate(16 116)"><use href="#route-marker"/></g>
  <g transform="translate(248 118)"><use href="#route-chart-mark"/></g>
</svg>
