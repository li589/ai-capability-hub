  <rect width="512" height="512" fill="#FFFFFF"/>

  <circle cx="205" cy="181" r="131" fill="url(#topGradient)"/>
  <circle cx="196" cy="294" r="131" fill="url(#leftGradient)"/>
  <circle cx="307" cy="233" r="131" fill="url(#rightGradient)"/>

  <path fill="#FAFFFF"
