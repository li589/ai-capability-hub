<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">MediaKit icon</title>
  <desc id="desc">Three overlapping blue gradient circles surrounding a white play symbol.</desc>

  <defs>
    <linearGradient id="topGradient" x1="132" y1="70" x2="292" y2="286"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#72D6F2"/>
      <stop offset="0.55" stop-color="#489BF4"/>
      <stop offset="1" stop-color="#2367F5"/>
    </linearGradient>

    <linearGradient id="leftGradient" x1="132" y1="178" x2="276" y2="406"
