<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161823"/>
      <stop offset="1" stop-color="#0D0E15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#dl-bg)"/>

  <!-- Four platform dots (top row) -->
  <circle cx="8"  cy="8"  r="2.4" fill="#FE2C55"/>
  <circle cx="13" cy="8"  r="2.4" fill="#FF9500"/>
  <circle cx="18" cy="8"  r="2.4" fill="#25F4EE"/>
  <circle cx="23" cy="8"  r="2.4" fill="#FF0000"/>

  <!-- Download arrow (center) -->
  <rect x="14.5" y="12" width="3" height="8" fill="#fff" rx="0.5"/>
  <path d="M10.5,18 L16,24 L21.5,18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom bar (receiving) -->
  <rect x="9" y="25.5" width="14" height="2.2" rx="1.1" fill="#25F4EE" opacity="0.85"/>
</svg>
