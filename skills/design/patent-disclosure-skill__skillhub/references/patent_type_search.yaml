# 按专利类型检索（查新适配）

案件类型来自 `prompts/disclosure/intake.md`（默认 invention）。

**解读模式**：有明确中国公开号时，可用文献种类码自动判别（`A/B`→发明，`U/Y`→实用新型，`S`→外观），无需用户口头声明：

```bash
python ${CLAUDE_SKILL_DIR}/tools/shared/patent_type.py --pub CN209861402U
# fetch_patent_pdf.py 成功时 stdout / fetch_pdf_status.json 亦含 patent_type
```

实现：`infer_patent_type_from_pub` / `resolve_reader_patent_type`（`tools/shared/patent_type.py`）；挂钩见 `prompts/reader/type_hooks.md`。

## 国知局 · 中国专利公布公告（已支持）

首页四类勾选（与官网一致）：

| 技能 `--type` | 勾选 |
|---------------|------|
| `invention` | 发明公布 `#fmgb` + 发明授权 `#fmsq` |
| `utility_model` | 实用新型 `#xxsq` |
| `design` | 外观设计 `#wgsq` |
| `all`（默认） | 四类全选 |

```bash
python ${CLAUDE_SKILL_DIR}/tools/crawl/cnipa_epub_search.py --type utility_model 卡扣
python ${CLAUDE_SKILL_DIR}/tools/crawl/cnipa_epub_search.py --type design 灯具
python ${CLAUDE_SKILL_DIR}/tools/crawl/cnipa_epub_search.py --type invention 调度
```

实现：`tools/shared/patent_type.py` + `tools/crawl/cnipa_epub_crawler.apply_epub_type_filter`。

## Google Patents（降级 / 补充；WebSearch 或浏览器）

| 类型 | 是否有官方 type | 建议 |
|------|-----------------|------|
| 发明 | `type=PATENT`（界面 Patent） | `country:CN` + 关键词；公开号 CN…A/B |
| 实用新型 | **无**独立 Utility Model 类型 | 仍用 PATENT 域 + 关键词 `实用新型` 或公开号 …U；**优先国知局 `--type utility_model`** |
| 外观 | `type=DESIGN` | `country:CN` + DESIGN；公开号常见 …S |

无独立 Google Patents 爬虫时，Agent 用 WebSearch；查询串可参考 `patent_type.google_patents_websearch_query()`。

## Google 学术（scholar.google.com）

**不支持**按发明/实用新型/外观过滤（面向论文等非专利文献）。  
类型指定后：学术检索仍按技术关键词；**专利文献类型过滤以国知局 / Google Patents 为准**。

## 映射摘要

```yaml
invention:
  cnipa: [--type, invention]
  google_patents: { type: PATENT, extra: "country:CN" }
  google_scholar: { patent_type_filter: false }
utility_model:
  cnipa: [--type, utility_model]
  google_patents: { type: PATENT, extra: "country:CN 实用新型" }
  google_scholar: { patent_type_filter: false }
design:
  cnipa: [--type, design]
  google_patents: { type: DESIGN, extra: "country:CN" }
  google_scholar: { patent_type_filter: false }
```
