<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triage Board</title>
<style>
:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #f8f9fa;
  --color-background-tertiary: #f1f3f5;
  --color-text-primary: #1a1a2e;
  --color-text-secondary: #555770;
  --color-text-tertiary: #8b8da3;
  --color-border-tertiary: #e2e4e9;
  --color-border-secondary: #c8cad0;
  --color-border-primary: #6e6e80;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: 'Georgia', serif;
  --font-mono: 'SF Mono', 'Fira Code', monospace;
  --border-radius-md: 8px;
  --border-radius-lg: 10px;
  --border-radius-xl: 12px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 2px 8px rgba(0,0,0,.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.12);
  --color-sky-1: #e0f7ff; --color-sky-2: #b8ecff; --color-sky-3: #8adeff;
  --color-sky-5: #33c0ff; --color-sky-6: #15aaf0; --color-sky-8: #0980be;
  --color-sky-9: #066ba0;
  --color-indigo-1: #edf2ff; --color-indigo-2: #dbe4ff; --color-indigo-3: #bac8ff;
  --color-indigo-5: #748ffc; --color-indigo-6: #5c7cfa; --color-indigo-8: #4263eb;
  --color-indigo-9: #3b5bdb;
  --color-amber-1: #fff9db; --color-amber-2: #fff3bf; --color-amber-3: #ffec99;
  --color-amber-5: #ffd43b; --color-amber-6: #fcc419; --color-amber-8: #f59f00;
  --color-amber-9: #f08c00; --color-amber-10: #e67700;
  --color-slate-1: #f8f9fa; --color-slate-2: #f1f3f5; --color-slate-3: #e9ecef;
  --color-slate-4: #dee2e6; --color-slate-5: #ced4da; --color-slate-6: #adb5bd;
  --color-slate-7: #868e96; --color-slate-8: #495057; --color-slate-9: #343a40;
  --color-slate-10: #212529;
  --color-coral-1: #fff5f5; --color-coral-2: #ffe3e3; --color-coral-5: #ff8787;
  --color-coral-6: #ff6b6b; --color-coral-8: #f03e3e; --color-coral-9: #e03131;
  --color-mint-1: #e6fcf5; --color-mint-2: #c3fae8; --color-mint-6: #20c997;
  --color-mint-8: #0ca678; --color-mint-9: #099268;
  --color-violet-1: #f3f0ff; --color-violet-5: #9775fa; --color-violet-8: #7048e8;
  --color-violet-9: #6741d9;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans); background: var(--color-background-tertiary);
  color: var(--color-text-primary); line-height: 1.5;
}
.panel {
  max-width: 1140px; margin: 20px auto;
  background: var(--color-background-primary);
  border-radius: var(--border-radius-xl);
  box-shadow: var(--shadow-lg); overflow: hidden;
}
.eyebrow {
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 1.5px; font-weight: 600;
}
header {
  padding: 22px 28px 16px; display: flex; align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--color-border-tertiary);
}
header .left .eyebrow { color: var(--color-indigo-8); }
header h1 { font-size: 20px; margin-top: 4px; }
.copy-btn {
  font-family: var(--font-mono); font-size: 12px; padding: 8px 16px;
  border-radius: var(--border-radius-md); border: 1px solid var(--color-border-secondary);
  background: var(--color-background-primary); cursor: pointer;
  font-weight: 600; transition: all .15s;
}
.copy-btn:hover { background: var(--color-indigo-1); border-color: var(--color-indigo-6);
  color: var(--color-indigo-9); }
.copy-btn.copied { background: var(--color-mint-1); border-color: var(--color-mint-6);
  color: var(--color-mint-9); }

.board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; min-height: 520px; }
.column {
  border-right: 1px solid var(--color-border-tertiary);
  padding: 0; display: flex; flex-direction: column;
}
.column:last-child { border-right: none; }
.col-header {
  padding: 14px 14px 10px; display: flex; justify-content: space-between;
  align-items: center; border-bottom: 3px solid;
}
.col-header .col-title { font-weight: 700; font-size: 14px; }
.col-header .col-pts {
  font-family: var(--font-mono); font-size: 12px; padding: 2px 8px;
  border-radius: 12px; font-weight: 600;
}
.col-body {
  flex: 1; padding: 10px; min-height: 100px;
  transition: background .15s;
}
.col-body.drag-over { background: var(--color-background-secondary); }

/* Column colors */
.col-now .col-header { border-bottom-color: var(--color-sky-6); }
.col-now .col-header .col-pts { background: var(--color-sky-1); color: var(--color-sky-9); }
.col-next .col-header { border-bottom-color: var(--color-indigo-6); }
.col-next .col-header .col-pts { background: var(--color-indigo-1); color: var(--color-indigo-9); }
.col-later .col-header { border-bottom-color: var(--color-amber-6); }
.col-later .col-header .col-pts { background: var(--color-amber-1); color: var(--color-amber-10); }
.col-cut .col-header { border-bottom-color: var(--color-slate-5); }
.col-cut .col-header .col-pts { background: var(--color-slate-2); color: var(--color-slate-8); }

.ticket {
  background: var(--color-background-primary); border: 1px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md); padding: 10px 12px; margin-bottom: 8px;
  cursor: grab; transition: box-shadow .15s, transform .15s;
  border-left: 3px solid var(--color-border-tertiary);
}
.ticket:active { cursor: grabbing; }
.ticket.dragging { opacity: .4; transform: scale(.96); }
.ticket:hover { box-shadow: var(--shadow-md); }
.ticket .top-row { display: flex; justify-content: space-between; align-items: center; }
.ticket .tid { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-tertiary); }
.ticket .assignee {
  width: 24px; height: 24px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 10px;
  font-weight: 700; color: #fff; flex-shrink: 0;
}
.ticket .title { font-size: 13px; font-weight: 600; margin: 4px 0; line-height: 1.3; }
.ticket .bottom-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.type-badge {
  display: inline-block; padding: 1px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 700; font-family: var(--font-mono);
  text-transform: uppercase; letter-spacing: .5px;
}
.type-bug { background: var(--color-coral-1); color: var(--color-coral-9); border-left-color: var(--color-coral-5) !important; }
.type-feat { background: var(--color-mint-1); color: var(--color-mint-9); border-left-color: var(--color-mint-6) !important; }
.type-debt { background: var(--color-violet-1); color: var(--color-violet-9); border-left-color: var(--color-violet-5) !important; }
.size-pill {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  font-size: 10px; font-weight: 600; font-family: var(--font-mono);
  background: var(--color-slate-2); color: var(--color-slate-8);
}
</style>
</head>
<body>
<div class="panel">
  <header>
    <div class="left">
      <div class="eyebrow">Sprint Triage</div>
      <h1>Q1 Sprint 6 — Triage Board</h1>
    </div>
    <button class="copy-btn" onclick="copyMarkdown()">📋 Copy as Markdown</button>
  </header>
  <div class="board" id="board"></div>
</div>

<script>
const AVATAR_COLORS = [
  'var(--color-sky-8)', 'var(--color-indigo-8)', 'var(--color-violet-8)',
  'var(--color-coral-8)', 'var(--color-mint-8)', 'var(--color-amber-8)'
];
const SIZES = { S: 1, M: 2, L: 3 };

const TICKETS = [
  { id: 'PLT-301', title: 'Fix auth token refresh race condition', type: 'bug', size: 'M', assignee: 'CW', col: 'now' },
  { id: 'PLT-302', title: 'Implement gRPC health check endpoint', type: 'feat', size: 'S', assignee: 'LF', col: 'now' },
  { id: 'PLT-303', title: 'Upgrade Go to 1.22 across services', type: 'debt', size: 'L', assignee: 'WJ', col: 'now' },
  { id: 'PLT-304', title: 'Add rate limit headers to API responses', type: 'feat', size: 'S', assignee: 'ZL', col: 'now' },
  { id: 'PLT-305', title: 'Connection pool leak under high load', type: 'bug', size: 'L', assignee: 'CW', col: 'now' },
  { id: 'PLT-306', title: 'Build Grafana dashboard for sync latency', type: 'feat', size: 'M', assignee: 'LF', col: 'next' },
  { id: 'PLT-307', title: 'Migrate CI to Buildkite from Jenkins', type: 'debt', size: 'L', assignee: 'WJ', col: 'next' },
  { id: 'PLT-308', title: 'Flaky test: TestStreamReconnect', type: 'bug', size: 'S', assignee: 'ZL', col: 'next' },
  { id: 'PLT-309', title: 'Add OpenTelemetry span for DB queries', type: 'feat', size: 'M', assignee: 'CW', col: 'next' },
  { id: 'PLT-310', title: 'Evaluate CockroachDB for user store', type: 'debt', size: 'M', assignee: 'LF', col: 'next' },
  { id: 'PLT-311', title: 'Webhook retry with exponential backoff', type: 'feat', size: 'M', assignee: 'WJ', col: 'later' },
  { id: 'PLT-312', title: 'Remove deprecated /v1/sync endpoint', type: 'debt', size: 'S', assignee: 'ZL', col: 'later' },
  { id: 'PLT-313', title: 'Support JSON log format for ELK', type: 'feat', size: 'S', assignee: 'CW', col: 'later' },
  { id: 'PLT-314', title: 'Fix timezone bug in audit log timestamps', type: 'bug', size: 'S', assignee: 'LF', col: 'later' },
  { id: 'PLT-315', title: 'Schema migration framework (atlas)', type: 'debt', size: 'L', assignee: 'WJ', col: 'later' },
  { id: 'PLT-316', title: 'Dark mode for admin dashboard', type: 'feat', size: 'M', assignee: 'ZL', col: 'cut' },
  { id: 'PLT-317', title: 'GraphQL API exploration (spike)', type: 'debt', size: 'L', assignee: 'CW', col: 'cut' },
  { id: 'PLT-318', title: 'Animated onboarding walkthrough', type: 'feat', size: 'L', assignee: 'LF', col: 'cut' },
  { id: 'PLT-319', title: 'Localization support for error messages', type: 'feat', size: 'M', assignee: 'WJ', col: 'cut' },
  { id: 'PLT-320', title: 'Benchmark: Redis vs Memcached for sessions', type: 'debt', size: 'S', assignee: 'ZL', col: 'cut' },
];

const COLUMNS = [
  { key: 'now', label: 'Now', cls: 'col-now' },
  { key: 'next', label: 'Next', cls: 'col-next' },
  { key: 'later', label: 'Later', cls: 'col-later' },
  { key: 'cut', label: 'Cut', cls: 'col-cut' },
];

function getAvatarColor(initials) {
  let h = 0;
  for (let i = 0; i < initials.length; i++) h = initials.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

function calcPoints(colKey) {
  return TICKETS.filter(t => t.col === colKey).reduce((s, t) => s + SIZES[t.size], 0);
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLUMNS.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = `column ${col.cls}`;
    const pts = calcPoints(col.key);
    colEl.innerHTML = `
      <div class="col-header">
        <span class="col-title">${col.label}</span>
        <span class="col-pts">${pts} pts</span>
      </div>
    `;
    const body = document.createElement('div');
    body.className = 'col-body';
    body.dataset.col = col.key;

    body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('drag-over'); });
    body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
    body.addEventListener('drop', e => {
      e.preventDefault(); body.classList.remove('drag-over');
      const tid = e.dataTransfer.getData('text/plain');
      const ticket = TICKETS.find(t => t.id === tid);
      if (ticket) { ticket.col = col.key; renderBoard(); }
    });

    TICKETS.filter(t => t.col === col.key).forEach(t => {
      const card = document.createElement('div');
      card.className = `ticket type-${t.type}`;
      card.draggable = true;
      card.dataset.id = t.id;
      card.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', t.id);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));

      card.innerHTML = `
        <div class="top-row">
          <span class="tid">${t.id}</span>
          <div class="assignee" style="background:${getAvatarColor(t.assignee)}">${t.assignee}</div>
        </div>
        <div class="title">${t.title}</div>
        <div class="bottom-row">
          <span class="type-badge type-${t.type}">${t.type}</span>
          <span class="size-pill">${t.size}</span>
        </div>
      `;
      body.appendChild(card);
    });

    colEl.appendChild(body);
    board.appendChild(colEl);
  });
}

function copyMarkdown() {
  let md = `# Triage Board — Q1 Sprint 6\n\n`;
  COLUMNS.forEach(col => {
    const items = TICKETS.filter(t => t.col === col.key);
    const pts = items.reduce((s, t) => s + SIZES[t.size], 0);
    md += `## ${col.label} (${pts} pts)\n\n`;
    md += `| ID | Title | Type | Size | Assignee |\n`;
    md += `|----|-------|------|------|----------|\n`;
    items.forEach(t => {
      md += `| ${t.id} | ${t.title} | ${t.type} | ${t.size} | ${t.assignee} |\n`;
    });
    md += `\n`;
  });

  navigator.clipboard.writeText(md).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy as Markdown'; btn.classList.remove('copied'); }, 2000);
  });
}

renderBoard();
</script>
</body>
</html>
