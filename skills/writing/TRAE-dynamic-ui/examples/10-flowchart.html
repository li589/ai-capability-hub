<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CI/CD Pipeline Flowchart</title>
<style>
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f8f9fa;
    --color-background-tertiary: #f0f1f3;
    --color-text-primary: #1a1a2e;
    --color-text-secondary: #5a5a7a;
    --color-text-tertiary: #9a9ab0;
    --color-border-tertiary: #e2e4e9;
    --color-border-secondary: #c8cad0;
    --color-border-primary: #6e6e8a;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    --border-radius-md: 8px;
    --border-radius-lg: 10px;
    --border-radius-xl: 12px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    --color-sky-1: #e8f4fd; --color-sky-2: #c5e4f9; --color-sky-3: #90caf4;
    --color-sky-5: #42a5f5; --color-sky-7: #1976d2; --color-sky-9: #0d47a1;
    --color-mint-1: #e0f7f0; --color-mint-2: #b2ebdb; --color-mint-3: #80debc;
    --color-mint-5: #4caf85; --color-mint-7: #2e7d5a; --color-mint-9: #1b5e3b;
    --color-coral-1: #ffeaea; --color-coral-2: #ffcdd2; --color-coral-3: #ef9a9a;
    --color-coral-5: #ef5350; --color-coral-7: #c62828;
    --color-amber-1: #fff8e1; --color-amber-5: #ffc107; --color-amber-7: #f57f17;
    --color-indigo-1: #e8eaf6; --color-indigo-5: #5c6bc0; --color-indigo-7: #303f9f;
    --color-violet-1: #f3e5f5; --color-violet-5: #ab47bc; --color-violet-7: #7b1fa2;
    --color-slate-2: #e8eaed; --color-slate-5: #78849e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    background: var(--color-background-tertiary);
    color: var(--color-text-primary);
    padding: 24px;
  }
  .header { margin-bottom: 20px; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--color-indigo-5); margin-bottom: 6px;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--color-text-secondary); font-size: 13px; }
  .layout { display: flex; gap: 16px; }
  .chart-area {
    flex: 1; background: var(--color-background-primary);
    border: 1px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-xl);
    padding: 20px; box-shadow: var(--shadow-sm);
    overflow-x: auto; min-width: 0;
  }
  .chart-area svg { display: block; margin: 0 auto; cursor: default; }
  .chart-area svg .node { cursor: pointer; }
  .chart-area svg .node:hover rect,
  .chart-area svg .node:hover polygon { filter: brightness(0.95); }
  .detail-panel {
    width: 260px; flex-shrink: 0;
    background: var(--color-background-primary);
    border: 1px solid var(--color-border-tertiary);
    border-left: 4px solid var(--color-indigo-5);
    border-radius: var(--border-radius-xl);
    padding: 20px; box-shadow: var(--shadow-sm);
    font-size: 13px;
    transition: border-left-color 0.2s;
  }
  .detail-panel .eyebrow { margin-bottom: 10px; }
  .detail-panel h3 { font-size: 15px; margin-bottom: 8px; }
  .detail-panel p { color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 8px; }
  .detail-panel .tag {
    display: inline-block; font-family: var(--font-mono); font-size: 10px;
    padding: 2px 8px; border-radius: 4px; margin-right: 4px; margin-bottom: 4px;
  }
  .tag-time { background: var(--color-sky-1); color: var(--color-sky-7); }
  .tag-pass { background: var(--color-mint-1); color: var(--color-mint-7); }
  .tag-fail { background: var(--color-coral-1); color: var(--color-coral-7); }
  .legend {
    margin-top: 16px; display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 12px; color: var(--color-text-secondary);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-box {
    width: 20px; height: 14px; border-radius: 3px;
    border: 1.5px solid var(--color-border-tertiary);
  }
  .legend-diamond {
    width: 14px; height: 14px; transform: rotate(45deg);
    border: 1.5px solid var(--color-amber-5); background: var(--color-amber-1);
  }
</style>
</head>
<body>
  <div class="header">
    <div class="eyebrow">CI/CD Pipeline</div>
    <h1>Monorepo Deploy Pipeline</h1>
    <p class="subtitle">Click any node to view step details in the side panel.</p>
  </div>
  <div class="layout">
    <div class="chart-area">
      <svg width="720" height="260" viewBox="0 0 720 260">
        <defs>
          <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="var(--color-mint-5)"/>
          </marker>
          <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="var(--color-coral-5)"/>
          </marker>
        </defs>
        <!-- NODES -->
        <g class="node" data-step="push" onclick="show('push')">
          <rect x="10" y="50" width="70" height="40" rx="6" fill="var(--color-sky-1)" stroke="var(--color-sky-5)" stroke-width="1.5"/>
          <text x="45" y="74" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-sky-7)">git push</text>
        </g>
        <line x1="85" y1="70" x2="110" y2="70" stroke="var(--color-mint-5)" stroke-width="1.5" marker-end="url(#arrowG)"/>
        <g class="node" data-step="ci" onclick="show('ci')">
          <rect x="115" y="50" width="70" height="40" rx="6" fill="var(--color-indigo-1)" stroke="var(--color-indigo-5)" stroke-width="1.5"/>
          <text x="150" y="74" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-indigo-7)">CI Init</text>
        </g>
        <line x1="190" y1="70" x2="215" y2="70" stroke="var(--color-mint-5)" stroke-width="1.5" marker-end="url(#arrowG)"/>
        <!-- Tests diamond -->
        <g class="node" data-step="tests" onclick="show('tests')">
          <polygon points="260,40 300,70 260,100 220,70" fill="var(--color-amber-1)" stroke="var(--color-amber-5)" stroke-width="1.5"/>
          <text x="260" y="74" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-amber-7)">Tests</text>
        </g>
        <!-- pass path -->
        <line x1="300" y1="70" x2="330" y2="70" stroke="var(--color-mint-5)" stroke-width="1.5" marker-end="url(#arrowG)"/>
        <text x="310" y="62" font-family="var(--font-mono)" font-size="9" fill="var(--color-mint-7)">pass</text>
        <!-- fail path down -->
        <line x1="260" y1="100" x2="260" y2="135" stroke="var(--color-coral-5)" stroke-width="1.5" marker-end="url(#arrowR)"/>
        <text x="274" y="122" font-family="var(--font-mono)" font-size="9" fill="var(--color-coral-7)">fail</text>
        <rect x="225" y="140" width="70" height="30" rx="5" fill="var(--color-coral-1)" stroke="var(--color-coral-5)" stroke-width="1.5"/>
        <text x="260" y="160" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-coral-7)">Notify</text>
        <!-- Build -->
        <g class="node" data-step="build" onclick="show('build')">
          <rect x="335" y="50" width="70" height="40" rx="6" fill="var(--color-violet-1)" stroke="var(--color-violet-5)" stroke-width="1.5"/>
          <text x="370" y="74" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-violet-7)">Build</text>
        </g>
        <line x1="410" y1="70" x2="435" y2="70" stroke="var(--color-mint-5)" stroke-width="1.5" marker-end="url(#arrowG)"/>
        <!-- Canary -->
        <g class="node" data-step="canary" onclick="show('canary')">
          <rect x="440" y="50" width="70" height="40" rx="6" fill="var(--color-amber-1)" stroke="var(--color-amber-5)" stroke-width="1.5"/>
          <text x="475" y="74" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-amber-7)">Canary</text>
        </g>
        <line x1="515" y1="70" x2="540" y2="70" stroke="var(--color-mint-5)" stroke-width="1.5" marker-end="url(#arrowG)"/>
        <!-- Promote -->
        <g class="node" data-step="promote" onclick="show('promote')">
          <rect x="545" y="50" width="70" height="40" rx="6" fill="var(--color-mint-1)" stroke="var(--color-mint-5)" stroke-width="1.5"/>
          <text x="580" y="74" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-mint-7)">Promote</text>
        </g>
        <line x1="620" y1="70" x2="640" y2="70" stroke="var(--color-mint-5)" stroke-width="1.5" marker-end="url(#arrowG)"/>
        <!-- Smoke diamond -->
        <g class="node" data-step="smoke" onclick="show('smoke')">
          <polygon points="680,40 710,70 680,100 650,70" fill="var(--color-amber-1)" stroke="var(--color-amber-5)" stroke-width="1.5"/>
          <text x="680" y="74" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="var(--color-amber-7)">Smoke</text>
        </g>
        <!-- Smoke fail -->
        <line x1="680" y1="100" x2="680" y2="135" stroke="var(--color-coral-5)" stroke-width="1.5" marker-end="url(#arrowR)"/>
        <text x="694" y="122" font-family="var(--font-mono)" font-size="9" fill="var(--color-coral-7)">fail</text>
        <rect x="645" y="140" width="70" height="30" rx="5" fill="var(--color-coral-1)" stroke="var(--color-coral-5)" stroke-width="1.5"/>
        <text x="680" y="160" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-coral-7)">Rollback</text>
        <!-- Done (pass from smoke) -->
        <line x1="680" y1="40" x2="680" y2="18" stroke="var(--color-mint-5)" stroke-width="1.5" marker-end="url(#arrowG)"/>
        <text x="694" y="30" font-family="var(--font-mono)" font-size="9" fill="var(--color-mint-7)">pass</text>
        <g class="node" data-step="done" onclick="show('done')">
          <rect x="650" y="0" width="60" height="20" rx="10" fill="var(--color-mint-2)" stroke="var(--color-mint-5)" stroke-width="1.5"/>
          <text x="680" y="14" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="700" fill="var(--color-mint-9)">DONE</text>
        </g>
        <!-- Canary fail -->
        <line x1="475" y1="90" x2="475" y2="135" stroke="var(--color-coral-5)" stroke-width="1.5" marker-end="url(#arrowR)"/>
        <text x="489" y="118" font-family="var(--font-mono)" font-size="9" fill="var(--color-coral-7)">fail</text>
        <rect x="440" y="140" width="70" height="30" rx="5" fill="var(--color-coral-1)" stroke="var(--color-coral-5)" stroke-width="1.5"/>
        <text x="475" y="160" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--color-coral-7)">Rollback</text>
      </svg>
      <div class="legend">
        <div class="legend-item"><div class="legend-box" style="background:var(--color-sky-1);border-color:var(--color-sky-5)"></div>Trigger</div>
        <div class="legend-item"><div class="legend-box" style="background:var(--color-indigo-1);border-color:var(--color-indigo-5)"></div>Setup</div>
        <div class="legend-item"><div class="legend-diamond"></div>Decision</div>
        <div class="legend-item"><div class="legend-box" style="background:var(--color-violet-1);border-color:var(--color-violet-5)"></div>Build</div>
        <div class="legend-item"><div class="legend-box" style="background:var(--color-mint-1);border-color:var(--color-mint-5)"></div>Deploy</div>
        <div class="legend-item"><div class="legend-box" style="background:var(--color-coral-1);border-color:var(--color-coral-5)"></div>Failure</div>
      </div>
    </div>
    <div class="detail-panel" id="detailPanel">
      <div class="eyebrow">Step Details</div>
      <h3 id="detailTitle">Select a node</h3>
      <p id="detailDesc">Click any step in the flowchart to see what it does, how long it takes, and its failure paths.</p>
      <div id="detailTags"></div>
    </div>
  </div>

<script>
const steps = {
  push: { title:'git push', desc:'Developer pushes to main or opens a PR. Webhook triggers CI pipeline via GitHub Actions.', tags:[{t:'~2s',c:'time'},{t:'trigger',c:'pass'}] },
  ci: { title:'CI Init', desc:'Checkout code, restore caches (node_modules, Cargo target), detect affected packages in monorepo using Nx.', tags:[{t:'~30s',c:'time'}] },
  tests: { title:'Tests (Lint + Unit + Integration)', desc:'Run ESLint, rustfmt, cargo test, vitest in parallel across affected packages. Fail-fast on first error.', tags:[{t:'~4min',c:'time'},{t:'pass → build',c:'pass'},{t:'fail → notify',c:'fail'}] },
  build: { title:'Build Artifacts', desc:'Compile Rust binaries (release mode), bundle JS/TS with esbuild, build Docker images. Outputs stored in artifact registry.', tags:[{t:'~6min',c:'time'}] },
  canary: { title:'Canary Deploy (5%)', desc:'Deploy to 5% of traffic. Monitor error rate, p99 latency, and memory for 10 minutes. Auto-rollback if SLO breached.', tags:[{t:'~12min',c:'time'},{t:'fail → rollback',c:'fail'}] },
  promote: { title:'Promote to 100%', desc:'Gradually shift traffic 5% → 25% → 50% → 100% over 20 minutes. Each step validates health checks.', tags:[{t:'~20min',c:'time'}] },
  smoke: { title:'Smoke Tests', desc:'Run critical-path E2E tests against production: login flow, API key generation, agent chat roundtrip.', tags:[{t:'~3min',c:'time'},{t:'pass → done',c:'pass'},{t:'fail → rollback',c:'fail'}] },
  done: { title:'Pipeline Complete ✓', desc:'All checks passed. Slack notification sent. Deployment tagged in GitHub release.', tags:[{t:'total ~45min',c:'time'},{t:'success',c:'pass'}] },
};
function show(key) {
  const s = steps[key];
  if (!s) return;
  document.getElementById('detailTitle').textContent = s.title;
  document.getElementById('detailDesc').textContent = s.desc;
  const tagsEl = document.getElementById('detailTags');
  tagsEl.innerHTML = s.tags.map(t =>
    `<span class="tag tag-${t.c}">${t.t}</span>`
  ).join('');
  const panel = document.getElementById('detailPanel');
  const colors = { push:'--color-sky-5', ci:'--color-indigo-5', tests:'--color-amber-5', build:'--color-violet-5', canary:'--color-amber-5', promote:'--color-mint-5', smoke:'--color-amber-5', done:'--color-mint-5' };
  panel.style.borderLeftColor = `var(${colors[key] || '--color-indigo-5'})`;
}
</script>
</body>
</html>
