examples:
  - id: example-1
    title:
      zh: 为商业提案应用专业主题
      en: 为商业提案应用专业主题
    description:
      zh: 我正在准备一份重要的商业提案演示文稿，需要一个专业且令人印象深刻的视觉风格。请帮我选择并应用一个适合企业环境的主题。
      en: 我正在准备一份重要的商业提案演示文稿，需要一个专业且令人印象深刻的视觉风格。请帮我选择并应用一个适合企业环境的主题。
    prompt:
      zh: |-
        我需要为这份商业提案创建专业的视觉呈现。请按照以下步骤操作：

        1. 首先展示 `theme-showcase.pdf` 文件，让我可以预览所有可用的主题选项
        2. 根据商业提案的性质，我会倾向于选择更加专业和正式的主题
        3. 我可能会选择类似 "Ocean Depths"（深海蓝）或 "Modern Minimalist"（现代极简）这样的主题
        4. 等待我确认选择的具体主题
        5. 应用所选主题的颜色方案和字体搭配到整个演示文稿中
        6. 确保所有幻灯片保持一致的视觉风格和良好的可读性

        重点关注：
        - 专业的企业形象
        - 清晰的信息层次
        - 良好的色彩对比度
        - 一致的品牌视觉识别
      en: |-
        我需要为这份商业提案创建专业的视觉呈现。请按照以下步骤操作：

        1. 首先展示 `theme-showcase.pdf` 文件，让我可以预览所有可用的主题选项
        2. 根据商业提案的性质，我会倾向于选择更加专业和正式的主题
        3. 我可能会选择类似 "Ocean Depths"（深海蓝）或 "Modern Minimalist"（现代极简）这样的主题
        4. 等待我确认选择的具体主题
        5. 应用所选主题的颜色方案和字体搭配到整个演示文稿中
        6. 确保所有幻灯片保持一致的视觉风格和良好的可读性

        重点关注：
        - 专业的企业形象
        - 清晰的信息层次
        - 良好的色彩对比度
        - 一致的品牌视觉识别
  - id: example-2
    title:
      zh: 为创意项目设计独特主题
      en: 为创意项目设计独特主题
    description:
      zh: 我有一个创意设计项目，想要一个充满活力和创新感的视觉主题。需要一个能够体现创造力和现代感的设计方案。
      en: 我有一个创意设计项目，想要一个充满活力和创新感的视觉主题。需要一个能够体现创造力和现代感的设计方案。
    prompt:
      zh: |-
        这是一个创意项目，需要体现创新精神和现代设计理念。请这样处理：

        1. 展示主题预览文件 `theme-showcase.pdf`
        2. 推荐考虑 "Sunset Boulevard"（日落大道）或 "Tech Innovation"（科技创新）这类富有活力的主题
        3. 这些主题具有：
           - 生动的色彩搭配
           - 现代感的视觉效果
           - 创意表达的空间
        4. 等待我的主题选择确认
        5. 将选定主题完整应用到项目的所有视觉元素中
        6. 确保整体设计既创新又保持专业水准

        设计要点：
        - 色彩要富有表现力但不杂乱
        - 字体选择要现代且易读
        - 整体风格要体现创意和专业性的平衡
      en: |-
        这是一个创意项目，需要体现创新精神和现代设计理念。请这样处理：

        1. 展示主题预览文件 `theme-showcase.pdf`
        2. 推荐考虑 "Sunset Boulevard"（日落大道）或 "Tech Innovation"（科技创新）这类富有活力的主题
        3. 这些主题具有：
           - 生动的色彩搭配
           - 现代感的视觉效果
           - 创意表达的空间
        4. 等待我的主题选择确认
        5. 将选定主题完整应用到项目的所有视觉元素中
        6. 确保整体设计既创新又保持专业水准

        设计要点：
        - 色彩要富有表现力但不杂乱
        - 字体选择要现代且易读
        - 整体风格要体现创意和专业性的平衡
  - id: example-3
    title:
      zh: 为学术报告选择学术主题
      en: 为学术报告选择学术主题
    description:
      zh: 我正在准备一份学术研究报告的演示，需要一个严肃、专业且不失优雅的视觉呈现方式。
      en: 我正在准备一份学术研究报告的演示，需要一个严肃、专业且不失优雅的视觉呈现方式。
    prompt:
      zh: |-
        学术报告需要严谨而优雅的视觉呈现。建议处理流程：

        1. 展示 `theme-showcase.pdf` 让我浏览所有主题选项
        2. 对于学术场合，推荐：
           - "Modern Minimalist"（现代极简）- 简洁专业
           - "Arctic Frost"（北极霜冻）- 清爽理性
           - "Forest Canopy"（森林树冠）- 自然稳重
        3. 这些主题的特点：
           - 配色简洁大方
           - 版式清晰易读
           - 符合学术规范
        4. 待我确认最终选择后
        5. 统一应用主题样式到所有幻灯片
        6. 确保文字清晰度和专业感

        学术报告特别注意：
        - 避免过于花哨的装饰
        - 保证数据图表的清晰呈现
        - 维持严肃专业的整体氛围
      en: |-
        学术报告需要严谨而优雅的视觉呈现。建议处理流程：

        1. 展示 `theme-showcase.pdf` 让我浏览所有主题选项
        2. 对于学术场合，推荐：
           - "Modern Minimalist"（现代极简）- 简洁专业
           - "Arctic Frost"（北极霜冻）- 清爽理性
           - "Forest Canopy"（森林树冠）- 自然稳重
        3. 这些主题的特点：
           - 配色简洁大方
           - 版式清晰易读
           - 符合学术规范
        4. 待我确认最终选择后
        5. 统一应用主题样式到所有幻灯片
        6. 确保文字清晰度和专业感

        学术报告特别注意：
        - 避免过于花哨的装饰
        - 保证数据图表的清晰呈现
        - 维持严肃专业的整体氛围
  - id: example-4
    title:
      zh: 为客户定制专属主题
      en: 为客户定制专属主题
    description:
      zh: 客户对现有的预设主题都不满意，希望根据他们的品牌色彩和偏好创建一个完全定制的主题方案。
      en: 客户对现有的预设主题都不满意，希望根据他们的品牌色彩和偏好创建一个完全定制的主题方案。
    prompt:
      zh: |-
        客户需要完全定制的主题解决方案。请按以下方式处理：

        1. 首先展示 `theme-showcase.pdf` 供参考
        2. 收集客户的具体需求：
           - 品牌主色调
           - 偏好的色彩风格（温暖/冷静/活泼等）
           - 目标受众特点
           - 使用场景要求
        3. 基于收集的信息创建全新主题：
           - 设计独特的主题名称
           - 选择协调的色彩搭配
           - 确定合适的字体组合
           - 定义整体视觉风格
        4. 展示创建的主题方案供客户审核
        5. 根据反馈进行调整优化
        6. 最终应用定制主题到所有相关内容

        定制主题要素：
        - 完全匹配客户品牌形象
        - 色彩搭配和谐统一
        - 符合目标受众审美
        - 适应具体使用场景
      en: |-
        客户需要完全定制的主题解决方案。请按以下方式处理：

        1. 首先展示 `theme-showcase.pdf` 供参考
        2. 收集客户的具体需求：
           - 品牌主色调
           - 偏好的色彩风格（温暖/冷静/活泼等）
           - 目标受众特点
           - 使用场景要求
        3. 基于收集的信息创建全新主题：
           - 设计独特的主题名称
           - 选择协调的色彩搭配
           - 确定合适的字体组合
           - 定义整体视觉风格
        4. 展示创建的主题方案供客户审核
        5. 根据反馈进行调整优化
        6. 最终应用定制主题到所有相关内容

        定制主题要素：
        - 完全匹配客户品牌形象
        - 色彩搭配和谐统一
        - 符合目标受众审美
        - 适应具体使用场景
  - id: example-5
    title:
      zh: 为产品发布会设计主题
      en: 为产品发布会设计主题
    description:
      zh: 即将举办新产品发布会，需要一个能够突出产品特色、营造 excitement 氛围的视觉主题。
      en: 即将举办新产品发布会，需要一个能够突出产品特色、营造 excitement 氛围的视觉主题。
    prompt:
      zh: |-
        产品发布会需要营造兴奋和期待的氛围。建议这样做：

        1. 展示 `theme-showcase.pdf` 查看所有可选主题
        2. 发布会主题应该具备：
           - "Golden Hour"（黄金时刻）- 温暖奢华感
           - "Sunset Boulevard"（日落大道）- 活力动感
           - "Tech Innovation"（科技创新）- 现代前沿感
        3. 重点考虑因素：
           - 产品特性与主题的契合度
           - 目标受众的喜好倾向
           - 发布会的整体调性要求
        4. 确认选择后应用主题
        5. 确保视觉效果能够：
           - 突出产品亮点
           - 营造期待氛围
           - 传递品牌价值
           - 增强观众参与感

        发布会主题特点：
        - 视觉冲击力强
        - 色彩搭配醒目
        - 整体风格现代化
        - 能够激发观众兴趣
      en: |-
        产品发布会需要营造兴奋和期待的氛围。建议这样做：

