{% extends 'base.html' %}{% block content %}<section class="card"><h1>{{SYSTEM_NAME}}</h1><p>当前用户：{{ user['username'] }}</p><p>业务域：{{BUSINESS_DOMAINS}}</p>{% if business_objects %}<h2>已生成业务模块</h2><div class="grid">{% for o in business_objects %}<a class="module" href="{{url_for('business.list_records',key=o.key)}}"><b>{{o.label}}</b><span>{{o.fields|length}} 个字段</span></a>{% endfor %}</div>{% else %}<p>当前仅有工程骨架，尚未生成业务对象。</p>{% endif %}<form method="post" action="/logout"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button>退出</button></form></section>{% endblock %}
