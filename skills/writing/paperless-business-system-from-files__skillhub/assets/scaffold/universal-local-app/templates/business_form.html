{% extends 'base.html' %}{% block content %}<section class="card"><h1>{{'新增' if mode=='new' else '修改'}} · {{obj.label}}</h1>{% if errors %}<div class="error">{% for e in errors %}<div>{{e}}</div>{% endfor %}</div>{% endif %}<form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}">{% for f in obj.fields %}<label>{{f.label}}{% if f.required %} *{% endif %}{% set v=values.get(f.key,'') if values else '' %}{% if f.enum_candidates %}<select name="{{f.key}}" {% if f.computed %}disabled{% endif %} {% if f.required %}required{% endif %}><option value="">请选择</option>{% for opt in f.enum_candidates %}<option value="{{opt}}" {% if v|string==opt|string %}selected{% endif %}>{{opt}}</option>{% endfor %}</select>{% elif f.type=='boolean' %}<select name="{{f.key}}" {% if f.computed %}disabled{% endif %} {% if f.required %}required{% endif %}><option value="">请选择</option><option value="1" {% if v in [1,'1','是','true',True] %}selected{% endif %}>是</option><option value="0" {% if v in [0,'0','否','false',False] %}selected{% endif %}>否</option></select>{% elif f.type=='date' %}<input type="date" name="{{f.key}}" value="{{v}}" {% if f.computed %}readonly{% endif %} {% if f.required %}required{% endif %}>{% elif f.type=='datetime' %}<input type="datetime-local" name="{{f.key}}" value="{{v|string|replace(' ','T')}}" {% if f.computed %}readonly{% endif %} {% if f.required %}required{% endif %}>{% elif f.type in ['integer','number'] %}<input type="number" {% if f.type=='number' %}step="any"{% else %}step="1"{% endif %} name="{{f.key}}" value="{{v}}" {% if f.computed %}readonly{% endif %} {% if f.required %}required{% endif %}>{% else %}<input type="text" name="{{f.key}}" value="{{v}}" {% if f.computed %}readonly{% endif %} {% if f.required %}required{% endif %}>{% endif %}{% if f.computed %}<small>由系统公式自动计算</small>{% endif %}</label>{% endfor %}<div class="actions"><button>保存</button><a class="btn secondary" href="{{url_for('business.list_records',key=obj.key)}}">取消</a></div></form></section>{% endblock %}
