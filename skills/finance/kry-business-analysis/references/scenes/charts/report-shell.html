<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- TITLE: 报告标题 - 日期 --></title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f7fb; color:#1a1f36; line-height:1.5; }

/* Hero 区域 */
.hero { background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%); color:#fff; padding:48px 40px 60px; position:relative; overflow:hidden; }
.hero::before { content:""; position:absolute; top:-40%; right:-10%; width:600px; height:600px; background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%); border-radius:50%; }
.hero-inner { position:relative; z-index:1; max-width:1400px; margin:0 auto; }
.brand-tag { display:inline-block; background:rgba(255,255,255,0.2); padding:6px 16px; border-radius:20px; font-size:13px; margin-bottom:16px; backdrop-filter:blur(10px); }
.hero h1 { font-size:38px; font-weight:700; margin-bottom:12px; letter-spacing:-1px; }
.hero-subtitle { font-size:16px; opacity:0.9; margin-bottom:24px; }
.hero-highlight { display:flex; gap:32px; flex-wrap:wrap; margin-top:24px; }
.hero-highlight div { display:flex; flex-direction:column; }
.hero-highlight .h-label { font-size:13px; opacity:0.8; }
.hero-highlight .h-val { font-size:28px; font-weight:700; margin-top:4px; }

/* 容器 */
.container { max-width:1400px; margin:-30px auto 40px; padding:0 24px; position:relative; z-index:2; }

/* Section 卡片 */
.section { background:#fff; border-radius:16px; padding:28px 28px 32px; box-shadow:0 4px 20px rgba(0,0,0,0.06); margin-bottom:24px; }
.section-title { font-size:20px; font-weight:700; margin-bottom:6px; color:#1a1f36; display:flex; align-items:center; gap:10px; }
.section-title::before { content:""; display:inline-block; width:4px; height:20px; background:linear-gradient(180deg,#6366f1,#ec4899); border-radius:2px; }
.section-sub { color:#6b7280; font-size:13px; margin-bottom:24px; }

/* KPI 卡片 */
.kpi-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:16px; }
.kpi-card { background:linear-gradient(135deg,#fafbff,#f0f2fe); padding:18px 20px; border-radius:12px; border:1px solid #e6e9f4; }
.kpi-label { font-size:12px; color:#6b7280; margin-bottom:8px; font-weight:500; }
.kpi-value { font-size:22px; font-weight:700; color:#1a1f36; letter-spacing:-0.5px; }
.kpi-delta { font-size:12px; margin-top:8px; display:flex; align-items:center; gap:6px; }
.delta { font-weight:600; padding:2px 8px; border-radius:6px; }
.delta.up { color:#059669; background:#d1fae5; }
.delta.down { color:#dc2626; background:#fee2e2; }
.delta.flat { color:#6b7280; background:#f3f4f6; }

/* Stats inline */
.stats-inline { display:flex; gap:20px; margin-top:12px; flex-wrap:wrap; }
.stats-inline > div { padding:10px 16px; background:#f5f7fb; border-radius:8px; }
.stats-inline .k { font-size:11px; color:#6b7280; }
.stats-inline .v { font-size:16px; font-weight:700; color:#111; margin-top:2px; }

/* 图表容器 */
.chart-box { width:100%; height:400px; }
.chart-box.tall { height:480px; }
.chart-box.short { height:320px; }

/* Grid 布局 */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; }

/* 数据表格 */
table { width:100%; border-collapse:collapse; font-size:13px; margin-top:16px; }
table th { background:#f9fafb; padding:10px 12px; text-align:left; color:#374151; font-weight:600; font-size:12px; border-bottom:2px solid #e5e7eb; }
table td { padding:9px 12px; border-bottom:1px solid #f3f4f6; }
table tr:hover { background:#fafbff; }
.num { text-align:right; font-variant-numeric:tabular-nums; color:#111; }

/* Insight 洞察卡片 */
.insights { display:grid; grid-template-columns:1fr; gap:12px; margin-top:16px; }
.insight { padding:16px 20px; border-radius:10px; border-left:4px solid; background:#f9fafb; }
.insight.good { border-color:#10b981; background:#ecfdf5; }
.insight.warn { border-color:#f59e0b; background:#fffbeb; }
.insight.info { border-color:#3b82f6; background:#eff6ff; }
.insight.risk { border-color:#ef4444; background:#fef2f2; }
.insight h4 { font-size:14px; margin-bottom:4px; }
.insight p { font-size:13px; color:#4b5563; line-height:1.6; }

/* Action 行动卡片 */
.action-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
.action-card { padding:18px; border-radius:12px; background:#f9fafb; border:1px solid #e5e7eb; }
.action-card .prio { display:inline-block; padding:2px 10px; border-radius:6px; font-size:11px; font-weight:700; margin-bottom:8px; }
.action-card .prio.p0 { background:#fee2e2; color:#dc2626; }
.action-card .prio.p1 { background:#fef3c7; color:#d97706; }
.action-card .prio.p2 { background:#dbeafe; color:#2563eb; }
.action-card h4 { font-size:15px; margin-bottom:6px; color:#111; }
.action-card p { font-size:13px; color:#4b5563; line-height:1.6; }

/* 数据口径说明 */
.data-quality { background:#eff6ff; border:1px solid #bfdbfe; border-left:4px solid #3b82f6; padding:16px 20px; border-radius:10px; font-size:13px; color:#1e40af; line-height:1.7; }

/* Footer */
.footer { text-align:center; padding:24px; color:#9ca3af; font-size:12px; }

/* 响应式 */
@media(max-width:1024px) { .kpi-grid{grid-template-columns:repeat(3,1fr)} .grid-2,.grid-3{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    <div class="brand-tag"><!-- HERO-TAG: 层级标签 · 场景名 --></div>
    <h1><!-- HERO-TITLE: 报告标题 --></h1>
    <div class="hero-subtitle"><!-- HERO-SUB: 日期范围 · 品牌名 · 汇总门店 N 家 --></div>
    <div class="hero-highlight">
      <!-- HERO-KPI: 3~4 个核心数字，每个格式如下 -->
      <!-- <div><span class="h-label">营业额</span><span class="h-val">12.5万</span></div> -->
    </div>
  </div>
</div>
<div class="container">
  <!-- SECTIONS: 在此插入各板块组件（从 components/ 复制并填充数据） -->
</div>
<div class="footer"><!-- FOOTER: 品牌名 · 数据参谋 · 生成时间 · 数据由客如云开放平台自动生成 --></div>
<script>
// 全局 resize 处理：所有图表自动响应窗口变化
window.addEventListener('resize', function() {
  var charts = document.querySelectorAll('.chart-box');
  charts.forEach(function(dom) {
    var instance = echarts.getInstanceByDom(dom);
    if (instance) instance.resize();
  });
});
</script>
</body>
</html>
