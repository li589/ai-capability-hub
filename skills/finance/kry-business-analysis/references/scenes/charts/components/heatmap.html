<!-- 组件: 热力图 -->
<!-- 用法: 复制到 container 内，替换 chartId、x/yLabels、data数组 -->
<div class="section">
  <div class="section-title"><!-- TITLE: 如 "🔥 时段营收热力" --></div>
  <div class="section-sub"><!-- SUB: 如 "星期×时段分布" --></div>
  <div id="<!-- CHART_ID: 唯一ID如 chart-heatmap -->" class="chart-box tall"></div>
</div>
<script>
(function(){
  var chart = echarts.init(document.getElementById('/* CHART_ID */'));
  chart.setOption({
    tooltip: { position: 'top' },
    grid: { top: 30, bottom: 60, left: 80, right: 30 },
    xAxis: { type: 'category', data: [/* DATA: X轴，如 ['周一','周二',...] */] },
    yAxis: { type: 'category', data: [/* DATA: Y轴，如 ['10:00','11:00',...] */] },
    visualMap: {
      min: 0,
      max: /* DATA: 最大值 */ 10000,
      calculable: true,
      orient: 'horizontal',
      left: 'center',
      bottom: 10,
      inRange: { color: ['#f0f9ff', '#3b82f6', '#1e40af'] }
    },
    series: [{
      type: 'heatmap',
      data: [/* DATA: 三元组数组 [x索引, y索引, 值] */],
      label: { show: true, fontSize: 10 }
    }]
  });
})();
</script>
