<!-- 数据表格组件 — 标准排行/明细表格 -->
<!-- 用途: 门店排行、菜品明细、员工绩效等结构化数据展示 -->
<div class="section">
  <div class="section-title"><!-- TITLE: 替换为板块标题，如"门店营收排行" --></div>
  <div class="section-sub"><!-- SUBTITLE: 替换为板块副标题 --></div>
  <table>
    <thead>
      <tr>
        <!-- DATA: 替换为实际表头 -->
        <th>排名</th>
        <th>名称</th>
        <th class="num">数值</th>
        <th class="num">环比</th>
      </tr>
    </thead>
    <tbody>
      <!-- DATA: 按需复制下方行模板，替换为真实数据 -->
      <tr>
        <td>1</td>
        <td>示例名称</td>
        <td class="num">12,345</td>
        <td class="num"><span class="delta up">↑ 8.2%</span></td>
      </tr>
    </tbody>
  </table>
</div>
