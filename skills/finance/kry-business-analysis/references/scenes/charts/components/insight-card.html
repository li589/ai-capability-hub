<!-- 洞察卡片组件 — 展示 AI 生成的经营洞察 -->
<!-- 用途: 正面洞察(good)、预警提示(warn)、信息补充(info)、风险告警(risk) -->
<div class="section">
  <div class="section-title"><!-- TITLE: 替换为板块标题，如"经营洞察" --></div>
  <div class="section-sub"><!-- SUBTITLE: 替换为板块副标题 --></div>
  <div class="insights">
    <!-- DATA: 按需复制下方模板，替换 type/title/content -->
    <div class="insight good">
      <h4>正面洞察标题</h4>
      <p>洞察内容描述，说明增长、突破或达标情况</p>
    </div>
    <div class="insight warn">
      <h4>预警提示标题</h4>
      <p>洞察内容描述，说明成本偏高或趋势转弱</p>
    </div>
    <div class="insight info">
      <h4>信息补充标题</h4>
      <p>洞察内容描述，结构分析或对比说明</p>
    </div>
    <div class="insight risk">
      <h4>风险告警标题</h4>
      <p>洞察内容描述，数据异常或严重下滑</p>
    </div>
  </div>
</div>
