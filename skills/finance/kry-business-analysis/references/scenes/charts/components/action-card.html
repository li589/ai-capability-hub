<!-- 行动项卡片组件 — 展示带优先级的下一步行动建议 -->
<!-- 优先级: p0=紧急(红), p1=重要(黄), p2=优化(蓝) -->
<div class="section">
  <div class="section-title"><!-- TITLE: 替换为板块标题，如"行动建议" --></div>
  <div class="section-sub"><!-- SUBTITLE: 替换为板块副标题 --></div>
  <div class="action-grid">
    <!-- DATA: 按需复制下方模板，替换优先级/标题/描述 -->
    <div class="action-card">
      <div class="prio p0">P0 · 紧急</div>
      <h4>行动标题</h4>
      <p>行动描述；目标：具体目标值</p>
    </div>
    <div class="action-card">
      <div class="prio p1">P1 · 重要</div>
      <h4>行动标题</h4>
      <p>行动描述；目标：具体目标值</p>
    </div>
    <div class="action-card">
      <div class="prio p2">P2 · 优化</div>
      <h4>行动标题</h4>
      <p>行动描述；目标：具体目标值</p>
    </div>
  </div>
</div>
