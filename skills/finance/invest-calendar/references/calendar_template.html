<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投资日历 · Financial Calendar</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --primary: #1e3a5f;
    --primary-dark: #15293f;
    --primary-light: #2c5282;
    --accent: #dc2626;
    --accent-light: #fef2f2;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --orange: #d97706;
    --orange-light: #fffbeb;
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --text: #0f172a;
    --text-2: #334155;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --border: #e8ecf1;
    --border-light: #f1f4f8;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
    --shadow: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
    --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.07), 0 2px 4px -2px rgba(15,23,42,0.05);
    --shadow-lg: 0 10px 15px -3px rgba(15,23,42,0.08), 0 4px 6px -4px rgba(15,23,42,0.05);
    --radius: 12px;
    --radius-md: 8px;
    --radius-sm: 6px;
    --radius-xs: 4px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ===== Header ===== */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .header-inner {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 28px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    color: var(--primary);
    flex-shrink: 0;
  }
  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(30,58,95,0.25);
  }
  .logo-text { letter-spacing: 0.5px; }
  .logo-text .sub { font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 2px; }
  .header-nav {
    display: flex;
    gap: 4px;
    margin-left: 8px;
  }
  .nav-item {
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--primary); }
  .nav-item.active { background: var(--primary); color: #fff; }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .search-box {
    position: relative;
    width: 240px;
  }
  .search-box input {
    width: 100%;
    height: 36px;
    padding: 0 12px 0 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--surface-2);
    color: var(--text);
    outline: none;
    transition: all 0.15s;
  }
  .search-box input:focus { border-color: var(--primary-light); background: var(--surface); box-shadow: 0 0 0 3px rgba(44,82,130,0.1); }
  .search-box .icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: 14px;
  }
  .btn-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
    transition: all 0.15s;
  }
  .btn-icon:hover { background: var(--surface-2); color: var(--primary); border-color: var(--primary-light); }

  /* ===== Main Layout ===== */
  .main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px 28px;
  }

  /* ===== Toolbar ===== */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .month-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .month-nav .btn-month {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
    font-size: 16px;
    transition: all 0.15s;
  }
  .btn-month:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .month-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    min-width: 140px;
    text-align: center;
  }
  .month-title .year { color: var(--text-muted); font-weight: 500; margin-left: 4px; }
  .btn-today {
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-today:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .view-switch {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
    gap: 2px;
  }
  .view-switch button {
    padding: 6px 14px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-radius: var(--radius-xs);
    transition: all 0.15s;
  }
  .view-switch button.active { background: var(--primary); color: #fff; }
  .view-switch button:hover:not(.active) { background: var(--surface-2); color: var(--text); }

  /* ===== Filter Bar ===== */
  .filter-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 4px;
  }
  .chip {
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .chip:hover { border-color: var(--primary-light); color: var(--primary); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip.imp-high.active { background: var(--accent); border-color: var(--accent); }
  .chip.imp-mid.active { background: var(--orange); border-color: var(--orange); }
  .chip.imp-low.active { background: var(--blue); border-color: var(--blue); }

  /* ===== Stat Strip ===== */
  .stat-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stat-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .stat-icon.s-total { background: var(--blue-light); color: var(--blue); }
  .stat-icon.s-high { background: var(--accent-light); color: var(--accent); }
  .stat-icon.s-cn { background: var(--accent-light); color: var(--accent); }
  .stat-icon.s-intl { background: var(--blue-light); color: var(--blue); }
  .stat-info { flex: 1; }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ===== Calendar Layout ===== */
  .cal-layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    align-items: start;
  }

  /* ===== Calendar ===== */
  .calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .cal-weekdays > div {
    text-align: center;
    padding: 12px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cal-weekdays .we { color: var(--accent); }
  .cal-body {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(118px, 1fr);
  }
  .cal-day {
    border-right: 1px solid var(--border-light);
    border-bottom: 1px solid var(--border-light);
    padding: 6px 6px 4px;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }
  .cal-day:nth-child(7n) { border-right: none; }
  .cal-day:hover { background: var(--surface-2); }
  .cal-day.out { background: #fbfcfd; }
  .cal-day.out .day-num { color: var(--text-light); }
  .cal-day.today { background: linear-gradient(180deg, rgba(220,38,38,0.03) 0%, transparent 100%); }
  .cal-day.today .day-num {
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
  }
  .cal-day.selected { background: rgba(44,82,130,0.06); box-shadow: inset 0 0 0 2px var(--primary-light); }
  .day-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2px;
  }
  .cal-day.we .day-num { color: var(--accent); }
  .cal-day.out.we .day-num { color: #fca5a5; }

  .ev {
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11px;
    line-height: 1.4;
    cursor: pointer;
    transition: all 0.12s;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    border-left: 3px solid;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .ev:hover { transform: translateX(2px); box-shadow: var(--shadow-sm); }
  .ev-time { font-size: 10px; opacity: 0.8; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .ev-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-high { background: var(--accent-light); color: #991b1b; border-color: var(--accent); }
  .ev-mid { background: var(--orange-light); color: #92400e; border-color: var(--orange); }
  .ev-low { background: var(--blue-light); color: #1e40af; border-color: var(--blue); }
  .ev-cn { }
  .ev-us { }
  .ev-eu { background: var(--green-light); color: #166534; border-color: var(--green); }
  .ev-more {
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    padding: 2px;
    cursor: pointer;
    font-weight: 500;
  }
  .ev-more:hover { color: var(--primary); }
  .holiday-mark {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 9px;
    background: var(--text-light);
    color: #fff;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
  }

  /* ===== Detail Panel ===== */
  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    position: sticky;
    top: 88px;
  }
  .dp-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border-light);
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
  }
  .dp-date {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .dp-date .d { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
  .dp-date .m { font-size: 14px; color: var(--text-muted); font-weight: 500; }
  .dp-date .weekday { font-size: 13px; color: var(--text-muted); margin-left: auto; }
  .dp-summary { font-size: 12px; color: var(--text-muted); }
  .dp-summary b { color: var(--accent); }
  .dp-body {
    max-height: calc(100vh - 240px);
    overflow-y: auto;
    padding: 12px;
  }
  .dp-body::-webkit-scrollbar { width: 6px; }
  .dp-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .dp-body::-webkit-scrollbar-track { background: transparent; }

  .event-card {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 10px;
    transition: all 0.15s;
    cursor: pointer;
    border-left: 4px solid;
  }
  .event-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .event-card.high { border-left-color: var(--accent); }
  .event-card.mid { border-left-color: var(--orange); }
  .event-card.low { border-left-color: var(--blue); }
  .ec-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .ec-time {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .ec-flag { font-size: 14px; }
  .ec-badge {
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
  }
  .ec-badge.high { background: var(--accent-light); color: var(--accent); }
  .ec-badge.mid { background: var(--orange-light); color: var(--orange); }
  .ec-badge.low { background: var(--blue-light); color: var(--blue); }
  .ec-cat {
    font-size: 10px;
    color: var(--text-muted);
    margin-left: auto;
    background: var(--surface-2);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .ec-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .ec-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 8px; }
  .ec-values {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 10px 0;
    padding: 10px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
  }
  .ec-val { text-align: center; }
  .ec-val .lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
  .ec-val .num { font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .ec-val .num.pos { color: var(--accent); }
  .ec-val .num.neg { color: var(--green); }
  .ec-surprise {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 10px;
    margin-top: 6px;
  }
  .ec-surprise.pos { background: var(--accent-light); color: var(--accent); }
  .ec-surprise.neg { background: var(--green-light); color: var(--green); }
  .ec-surprise.neutral { background: var(--surface-2); color: var(--text-muted); }
  .ec-assets {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border-light);
  }
  .ec-assets .lbl { font-size: 11px; color: var(--text-muted); margin-right: 4px; align-self: center; }
  .asset-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--text-2);
    border: 1px solid var(--border-light);
    font-weight: 500;
  }
  .ec-source { font-size: 11px; color: var(--text-light); margin-top: 8px; }

  .dp-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .dp-empty .icon { font-size: 40px; opacity: 0.4; margin-bottom: 12px; }

  /* ===== Legend ===== */
  .legend {
    display: flex;
    gap: 16px;
    padding: 12px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--text-muted);
    align-items: center;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; border-left: 3px solid; }
  .legend-dot.high { background: var(--accent-light); border-color: var(--accent); }
  .legend-dot.mid { background: var(--orange-light); border-color: var(--orange); }
  .legend-dot.low { background: var(--blue-light); border-color: var(--blue); }

  /* ===== List View ===== */
  .list-view { display: none; }
  .list-view.active { display: block; }
  .calendar.hidden, .detail-panel.hidden { display: none; }
  .cal-layout.list-mode { grid-template-columns: 1fr; }

  .lv-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .lv-group-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface) 100%);
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
    transition: background 0.12s;
  }
  .lv-group-header:hover { background: var(--surface-2); }
  .lv-date-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: var(--radius-sm);
    background: var(--primary);
    color: #fff;
    flex-shrink: 0;
  }
  .lv-date-box.today { background: var(--accent); }
  .lv-date-box .d { font-size: 22px; font-weight: 700; line-height: 1; }
  .lv-date-box .m { font-size: 10px; opacity: 0.85; margin-top: 2px; }
  .lv-date-info { display: flex; flex-direction: column; gap: 2px; }
  .lv-date-info .full { font-size: 15px; font-weight: 600; color: var(--text); }
  .lv-date-info .weekday { font-size: 12px; color: var(--text-muted); }
  .lv-date-info .weekday.we { color: var(--accent); }
  .lv-group-count {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .lv-count-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .lv-count-badge.high { background: var(--accent-light); color: var(--accent); }
  .lv-toggle { font-size: 14px; color: var(--text-light); transition: transform 0.2s; }
  .lv-group.collapsed .lv-toggle { transform: rotate(-90deg); }
  .lv-group.collapsed .lv-group-body { display: none; }

  .lv-group-body {
    padding: 8px 12px 12px;
  }
  .lv-event-row {
    display: grid;
    grid-template-columns: 70px 36px 1fr 120px 100px;
    gap: 16px;
    align-items: center;
    padding: 12px 12px;
    border-radius: var(--radius-sm);
    transition: background 0.12s;
    border-left: 4px solid transparent;
    cursor: pointer;
  }
  .lv-event-row:hover { background: var(--surface-2); box-shadow: var(--shadow-sm); }
  .lv-event-row.high { border-left-color: var(--accent); }
  .lv-event-row.mid { border-left-color: var(--orange); }

// 月份/年份标记：1月事件(month=0)，7月事件(month=6)
EVENTS.forEach(e => {
  if (e.id >= 100) { e.month = 6; e.year = 2026; }  // 7月
  else { e.month = 0; e.year = 2026; }               // 1月
});

const CAT_LABELS = {
  macro:"宏观经济", monetary:"央行政策", meeting:"重要会议", earnings:"财报",
  ipo:"新股申购", corporate:"公司事件", index:"指数调整"
};

const REGION_LABELS = { cn:"中国", us:"美国", eu:"欧元区", jp:"日本", global:"全球" };

// ===== State =====
// 用真实今天初始化，默认显示当天数据
let today0 = new Date();
let currentDate = new Date(today0);          // 选中日 = 今天
let viewDate = new Date(today0.getFullYear(), today0.getMonth(), 1);  // 查看月 = 今天所在月
let filters = { imp: ["high","mid","low"], region: ["cn","us","eu","jp","global"], cat: ["macro","monetary","meeting","earnings","ipo","corporate","index"] };

// ===== Helpers =====
const MONTHS_CN = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const WEEKDAYS_CN = ["周日","周一","周二","周三","周四","周五","周六"];

function getFilteredEvents() {
  const y = viewDate.getFullYear();
  const m = viewDate.getMonth();
  return EVENTS.filter(e =>
    filters.imp.includes(e.imp) &&
    filters.region.includes(e.region) &&
    filters.cat.includes(e.cat) &&
    e.year === y && e.month === m
  );
}

function getEventsByDay(day) {
  return getFilteredEvents().filter(e => e.day === day).sort((a,b) => {
    const ta = a.time.replace(/[^0-9:]/g,"").split(":")[0] || "99";
    const tb = b.time.replace(/[^0-9:]/g,"").split(":")[0] || "99";
    return (ta==="") - (tb==="") || ta.localeCompare(tb);
  });
}

// ===== Render Calendar =====
function renderCalendar() {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  document.getElementById("monthName").textContent = MONTHS_CN[month];
  document.getElementById("yearName").textContent = year;

  const firstDay = new Date(year, month, 1);
  let startWeekday = firstDay.getDay(); // 0=Sun
  if (startWeekday === 0) startWeekday = 7; // make Monday=0
  startWeekday -= 1;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();

  const calBody = document.getElementById("calBody");
  calBody.innerHTML = "";

  const today = new Date();

  // Build 6 weeks (42 cells)
  for (let i = 0; i < 42; i++) {
    const cell = document.createElement("div");
    cell.className = "cal-day";

    let dayNum, out = false;
    if (i < startWeekday) {
      dayNum = prevMonthDays - startWeekday + i + 1;
      out = true;
    } else if (i >= startWeekday + daysInMonth) {
      dayNum = i - startWeekday - daysInMonth + 1;
      out = true;
    } else {
      dayNum = i - startWeekday + 1;
    }

    if (out) cell.classList.add("out");
    const weekday = (i % 7); // 0=Mon
    if (weekday >= 5) cell.classList.add("we");

    // Today highlight (用真实今天，仅当查看的月份包含今天时高亮)
    if (!out && year === today.getFullYear() && month === today.getMonth() && dayNum === today.getDate()) {
      cell.classList.add("today");
    }
    // Selected
    if (!out && year === currentDate.getFullYear() && month === currentDate.getMonth() && dayNum === currentDate.getDate()) {
      cell.classList.add("selected");
    }

    const numEl = document.createElement("div");
    numEl.className = "day-num";
    numEl.textContent = dayNum;
    cell.appendChild(numEl);

    if (!out) {
      const dayEvents = getEventsByDay(dayNum);
      dayEvents.slice(0, 4).forEach(ev => {
        const evEl = document.createElement("div");
        evEl.className = `ev ev-${ev.imp} ev-${ev.region}`;
        const timeStr = ev.time.match(/\d{2}:\d{2}/) ? ev.time.match(/\d{2}:\d{2}/)[0] : (ev.time.length > 6 ? "" : ev.time);
        evEl.innerHTML = `${timeStr ? `<span class="ev-time">${timeStr}</span>` : ""}<span class="ev-title">${ev.flag} ${ev.title.replace(/^中国|^美国|^德国/, "")}</span>`;
        evEl.onclick = (e) => { e.stopPropagation(); selectDay(dayNum); };
        cell.appendChild(evEl);
      });
      if (dayEvents.length > 4) {
        const more = document.createElement("div");
        more.className = "ev-more";
        more.textContent = `+${dayEvents.length - 4} 更多`;
        cell.appendChild(more);
      }
      if (dayEvents.some(e => e.holiday)) {
        const hm = document.createElement("div");
        hm.className = "holiday-mark";
        hm.textContent = "休";
        cell.appendChild(hm);
      }
      cell.onclick = () => selectDay(dayNum);
    }

    calBody.appendChild(cell);
  }

  renderStats();
}

// ===== Render Stats =====
function renderStats() {
  const all = getFilteredEvents();
  const high = all.filter(e => e.imp === "high");
  const cn = all.filter(e => e.region === "cn");
  const intl = all.filter(e => e.region !== "cn");

  document.getElementById("statStrip").innerHTML = `
    <div class="stat-card">
      <div class="stat-icon s-total">📊</div>
      <div class="stat-info"><div class="stat-num">${all.length}</div><div class="stat-label">本月事件总数</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon s-high">🔴</div>
      <div class="stat-info"><div class="stat-num">${high.length}</div><div class="stat-label">高影响事件</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon s-cn">🇨🇳</div>
      <div class="stat-info"><div class="stat-num">${cn.length}</div><div class="stat-label">国内事件</div></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon s-intl">🌍</div>
      <div class="stat-info"><div class="stat-num">${intl.length}</div><div class="stat-label">国际事件</div></div>
    </div>
  `;
}

// ===== Select Day & Render Detail =====
function selectDay(day) {
  currentDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), day);
  renderCalendar();
  renderDetail();
}

// 切月后校正选中日：若选中日不在当前查看月，则取该月1号或今天(若同月)
function syncCurrentDateToView() {
  const vy = viewDate.getFullYear(), vm = viewDate.getMonth();
  if (currentDate.getFullYear() !== vy || currentDate.getMonth() !== vm) {
    const t = new Date();
    if (vy === t.getFullYear() && vm === t.getMonth()) {
      currentDate = new Date(t);
    } else {
      currentDate = new Date(vy, vm, 1);
    }
  }
}

function renderDetail() {
  const day = currentDate.getDate();
  const month = currentDate.getMonth();
  const weekday = currentDate.getDay();
  const events = getEventsByDay(day);

  document.getElementById("dpDay").textContent = day;
  document.getElementById("dpMonth").textContent = `${MONTHS_CN[month]} · ${WEEKDAYS_CN[weekday]}`;
  document.getElementById("dpWeekday").textContent = "";

  const highCount = events.filter(e => e.imp === "high").length;
  document.getElementById("dpSummary").innerHTML = `当日共 <b>${events.length}</b> 个事件，其中高影响 <b>${highCount}</b> 个`;

  const body = document.getElementById("dpBody");
  if (events.length === 0) {
    body.innerHTML = `<div class="dp-empty"><div class="icon">📭</div><div>当日无匹配事件</div><div style="font-size:12px;margin-top:6px;">尝试调整筛选条件</div></div>`;
    return;
  }

  body.innerHTML = events.map(ev => {
    const vals = (ev.prev || ev.exp || ev.actual) ? `
      <div class="ec-values">
        ${ev.prev ? `<div class="ec-val"><div class="lbl">前值</div><div class="num">${ev.prev}</div></div>` : ""}
        ${ev.exp ? `<div class="ec-val"><div class="lbl">预期</div><div class="num">${ev.exp}</div></div>` : ""}
        ${ev.actual ? `<div class="ec-val"><div class="lbl">实际</div><div class="num ${ev.surprise || ""}">${ev.actual}</div></div>` : `<div class="ec-val"><div class="lbl">实际</div><div class="num" style="color:var(--text-light)">待发布</div></div>`}
      </div>` : "";

    const surprise = ev.surprise ? `<div class="ec-surprise ${ev.surprise}">${ev.surprise === "pos" ? "⚠️" : "✅"} ${ev.surpriseText || (ev.surprise === "pos" ? "超预期" : "不及预期")}</div>` : "";

    const assets = ev.assets ? `
      <div class="ec-assets">
        <span class="lbl">关联资产：</span>
        ${ev.assets.map(a => `<span class="asset-tag">${a}</span>`).join("")}
      </div>` : "";

    return `
      <div class="event-card ${ev.imp}">
        <div class="ec-top">
          <span class="ec-time">${ev.time}</span>
          <span class="ec-flag">${ev.flag}</span>
          <span class="ec-badge ${ev.imp}">${ev.imp === "high" ? "高影响" : ev.imp === "mid" ? "中影响" : "低影响"}</span>
          <span class="ec-cat">${ev.cat_label || CAT_LABELS[ev.cat] || ""}</span>
        </div>
        <div class="ec-title">${ev.title}</div>
        ${ev.titleEn ? `<div style="font-size:11px;color:var(--text-light);margin-bottom:6px;">${ev.titleEn}</div>` : ""}
        <div class="ec-desc">${ev.desc}</div>
        ${vals}
        ${surprise}
        ${assets}
        <div class="ec-source">📌 来源：${ev.source}</div>
      </div>
    `;
  }).join("");
}

// ===== Render List View =====
function renderListView() {
  const all = getFilteredEvents();
  const container = document.getElementById("listView");

  if (all.length === 0) {
    container.innerHTML = `<div class="lv-empty"><div class="icon">📭</div><div>无匹配事件</div><div style="font-size:12px;margin-top:6px;">尝试调整筛选条件</div></div>`;
    return;
  }

  // Group by day, sorted
  const byDay = {};
  all.forEach(ev => {
    if (!byDay[ev.day]) byDay[ev.day] = [];
    byDay[ev.day].push(ev);
  });
  const days = Object.keys(byDay).map(Number).sort((a, b) => a - b);

  const weekdayFull = ["周日","周一","周二","周三","周四","周五","周六"];
  const month = viewDate.getMonth();

  container.innerHTML = days.map(day => {
    const events = byDay[day].sort((a, b) => {
      const ta = a.time.replace(/[^0-9:]/g,"").split(":")[0] || "99";
      const tb = b.time.replace(/[^0-9:]/g,"").split(":")[0] || "99";
      return (ta==="") - (tb==="") || ta.localeCompare(tb);
    });
    const highCount = events.filter(e => e.imp === "high").length;
    const dateObj = new Date(viewDate.getFullYear(), month, day);
    const wd = dateObj.getDay();
    const isToday = (function() {
      const t = new Date();
      return viewDate.getFullYear() === t.getFullYear() && month === t.getMonth() && day === t.getDate();
    })();
    const isWeekend = wd === 0 || wd === 6;

    const rows = events.map(ev => {
      const prevVal = ev.prev ? `<div class="lv-val"><span class="lbl">前值</span><span class="num">${ev.prev}</span></div>` : "";
      const expVal = ev.exp ? `<div class="lv-val"><span class="lbl">预期</span><span class="num">${ev.exp}</span></div>` : "";
      const actVal = ev.actual && ev.actual !== "—"
        ? `<div class="lv-val"><span class="lbl">实际</span><span class="num ${ev.surprise || ""}">${ev.actual}</span></div>`
        : `<div class="lv-val"><span class="lbl">实际</span><span class="num pending">待发布</span></div>`;
      const surprise = ev.surprise ? `<span class="lv-surprise ${ev.surprise}">${ev.surprise === "pos" ? "↑超预期" : "↓不及预期"}</span>` : "";

      return `
        <div class="lv-event-row ${ev.imp}" onclick="selectDay(${day})">
          <div class="lv-ev-time">${ev.time}</div>
          <div class="lv-ev-imp"><span class="imp-dot ${ev.imp}"></span></div>
          <div class="lv-ev-main">
            <div class="lv-ev-title"><span class="lv-ev-flag">${ev.flag}</span>${ev.title}${surprise}</div>
            <div class="lv-ev-desc">${ev.desc}</div>
          </div>
          <div class="lv-ev-vals">${prevVal}${expVal}${actVal}</div>
          <div class="lv-ev-tags">
            <span class="lv-tag cat">${ev.cat_label || CAT_LABELS[ev.cat] || ""}</span>
            ${ev.assets ? ev.assets.slice(0,2).map(a => `<span class="lv-tag">${a}</span>`).join("") : ""}
            ${ev.assets && ev.assets.length > 2 ? `<span class="lv-tag">+${ev.assets.length - 2}</span>` : ""}
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="lv-group" id="lvGroup-${day}">
        <div class="lv-group-header" onclick="toggleListGroup(${day})">
          <div class="lv-date-box ${isToday ? "today" : ""}">
            <span class="d">${day}</span>
            <span class="m">${MONTHS_CN[month]}</span>
          </div>
          <div class="lv-date-info">
            <span class="full">${viewDate.getFullYear()}年${MONTHS_CN[month]}${day}日</span>
            <span class="weekday ${isWeekend ? "we" : ""}">${weekdayFull[wd]}</span>
          </div>
          <div class="lv-group-count">
            共 ${events.length} 个事件
            ${highCount > 0 ? `<span class="lv-count-badge high">🔴 ${highCount} 高影响</span>` : ""}
          </div>
          <span class="lv-toggle">▾</span>
        </div>
        <div class="lv-group-body">${rows}</div>
      </div>
    `;
  }).join("");
}

function toggleListGroup(day) {
  const g = document.getElementById("lvGroup-" + day);
  if (g) g.classList.toggle("collapsed");
}

// ===== View Switch =====
let currentView = "calendar";
function switchView(view) {
  currentView = view;
  const calView = document.getElementById("calView");
  const listView = document.getElementById("listView");
  const detailPanel = document.getElementById("detailPanel");
  const calLayout = document.getElementById("calLayout");
  const legendTip = document.getElementById("legendTip");
  const btnCal = document.getElementById("btnCalView");
  const btnList = document.getElementById("btnListView");

  if (view === "list") {
    calView.classList.add("hidden");
    listView.classList.add("active");
    detailPanel.classList.add("hidden");
    calLayout.classList.add("list-mode");
    btnCal.classList.remove("active");
    btnList.classList.add("active");
    legendTip.textContent = "💡 点击事件行可查看完整详情 · 点击分组标题可折叠/展开";
    renderListView();
  } else {
    calView.classList.remove("hidden");
    listView.classList.remove("active");
    detailPanel.classList.remove("hidden");
    calLayout.classList.remove("list-mode");
    btnCal.classList.add("active");
    btnList.classList.remove("active");
    legendTip.textContent = "💡 点击日期查看当日事件详情 · 点击事件查看完整信息";
    renderCalendar();
  }
}

// ===== Filter Logic =====
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const filter = chip.dataset.filter;
    const val = chip.dataset.val;
    const idx = filters[filter].indexOf(val);
    if (idx > -1) {
      filters[filter].splice(idx, 1);
      chip.classList.remove("active");
    } else {
      filters[filter].push(val);
      chip.classList.add("active");
    }
    renderCalendar();
    if (currentView === "list") renderListView();
    renderDetail();
  });
});

// ===== View Switch Buttons =====
document.getElementById("btnCalView").addEventListener("click", () => switchView("calendar"));
document.getElementById("btnListView").addEventListener("click", () => switchView("list"));

// ===== Month Navigation =====
document.getElementById("prevMonth").addEventListener("click", () => {
  viewDate.setMonth(viewDate.getMonth() - 1);
  syncCurrentDateToView();
  renderCalendar();
  if (currentView === "list") renderListView();
  renderDetail();
});
document.getElementById("nextMonth").addEventListener("click", () => {
  viewDate.setMonth(viewDate.getMonth() + 1);
  syncCurrentDateToView();
  renderCalendar();
  if (currentView === "list") renderListView();
  renderDetail();
});
document.getElementById("todayBtn").addEventListener("click", () => {
  const today = new Date();
  viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
  currentDate = new Date(today);
  renderCalendar();
  if (currentView === "list") renderListView();
  renderDetail();
});

// ===== Init =====
renderCalendar();
renderDetail();
</script>
</body>
