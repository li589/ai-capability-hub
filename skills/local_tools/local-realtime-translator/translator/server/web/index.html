<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Translator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #64ffda;
        }
        .status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .status .dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            background: #f44;
        }
        .status.connected .dot { background: #4f4; }
        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .panel {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
        }
        .panel h2 {
            font-size: 16px;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .panel .content {
            font-size: 18px;
            line-height: 1.8;
            max-height: 400px;
            overflow-y: auto;
        }
        .sentence { margin-bottom: 8px; }
        /* asr1 (fast, Paraformer): greyish-white, leads in real time */
        .sentence.partial { color: #aaa; font-style: italic; }
        /* asr2 final: solid yellow, settled */
        .sentence.final { color: #ffd93d; }
        /* While asr2 streams over the same line, the prefix it has already
           recognized is yellow and the not-yet-covered tail keeps asr1's grey,
           so yellow eats the grey from left to right. */
        .asr-done { color: #ffd93d; font-style: italic; }
        .asr-pending { color: #aaa; font-style: italic; }
        .sentence .speaker { color: #64ffda; font-size: 12px; margin-right: 6px; }
        .translation { color: #ffd93d; }
        .translation.partial { color: #b8a030; font-style: italic; }
        .audio-btn {
            background: #0f3460;
            border: 1px solid #64ffda;
            color: #64ffda;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }
        .audio-btn:hover { background: #1a5276; }
    </style>
</head>
<body>
    <h1>Realtime Translator</h1>
    <div class="status" id="status">
        <span class="dot"></span>
        <span class="text">Connecting...</span>
    </div>
    <div class="panels">
        <div class="panel">
            <h2>Source (ASR)</h2>
            <div class="content" id="asr-content"></div>
        </div>
        <div class="panel">
            <h2>Translation</h2>
            <div class="content" id="translation-content"></div>
        </div>
    </div>

    <script>
        const asrContent = document.getElementById('asr-content');
        const transContent = document.getElementById('translation-content');
        const statusEl = document.getElementById('status');
        // One ASR line per sentence_id. asr1 (fast) creates it greyish-white,
        // asr2 (accurate) streams over the same line in yellow, then the final
        // settles it. Keyed by sentence_id so the two async streams (and the
        // next sentence's fast partials) never clobber each other.
        const asrLines = new Map();
        let sentenceCount = 0;

        function getAsrLine(sentenceId) {
            let el = asrLines.get(sentenceId);
            if (!el) {
                el = document.createElement('div');
                el.className = 'sentence partial';
                el._fastText = '';   // latest asr1 (fast) text for this line
                asrContent.appendChild(el);
                asrLines.set(sentenceId, el);
            }
            return el;
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
        }

        // Render an asr2 (accurate) partial: the prefix it has recognized so far
        // shown in yellow/red, plus asr1's not-yet-covered tail in grey, so the
        // accurate text eats the grey from left to right.
        //
        // asr1 (Paraformer) and asr2 (Qwen3) are DIFFERENT models, so their text
        // rarely matches char-for-char. A strict prefix test (fast.startsWith)
        // almost always fails, which made the grey tail vanish. Align by length
        // instead: asr2 has recognized N chars, so asr1's first N chars count as
        // "covered" (asr2's better text replaces them) and asr1's remaining tail
        // stays grey. Array.from so multi-code-unit chars count as one.
        function renderAccuratePartial(el, accText) {
            const fastChars = Array.from(el._fastText || '');
            const accLen = Array.from(accText).length;
            const tail = fastChars.length > accLen
                ? fastChars.slice(accLen).join('')
                : '';
            el.innerHTML = `<span class="asr-done">${escapeHtml(accText)}</span>`
                + (tail ? `<span class="asr-pending">${escapeHtml(tail)}</span>` : '');
        }

        function connect() {
            const ws = new WebSocket(`ws://${location.hostname}:8765`);

            ws.onopen = () => {
                statusEl.className = 'status connected';
                statusEl.querySelector('.text').textContent = 'Connected';
            };

            ws.onclose = () => {
                statusEl.className = 'status';
                statusEl.querySelector('.text').textContent = 'Disconnected. Reconnecting...';
                setTimeout(connect, 2000);
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === 'partial') {
                    const el = getAsrLine(msg.sentence_id);
                    el.className = 'sentence';
                    if (msg.stage === 'accurate') {
                        // yellow prefix eats asr1's grey tail from the left
                        renderAccuratePartial(el, msg.text);
                    } else {
                        // asr1 (fast): whole line grey; remember it so asr2 can
                        // keep the uncovered tail grey as it streams over it
                        el._fastText = msg.text;
                        el.innerHTML =
                            `<span class="asr-pending">${escapeHtml(msg.text)}</span>`;
                    }
                    asrContent.scrollTop = asrContent.scrollHeight;
                }
                else if (msg.type === 'final') {
                    const el = getAsrLine(msg.sentence_id);
                    el.className = 'sentence final';
                    let prefix = '';
                    if (msg.speaker) prefix = `<span class="speaker">[${escapeHtml(msg.speaker)}]</span>`;
                    el.innerHTML = prefix + escapeHtml(msg.text);
                    // Line is settled; drop it from the live map so the id can't
                    // be reused to mutate a finalized line.
                    asrLines.delete(msg.sentence_id);
                    sentenceCount++;
                    asrContent.scrollTop = asrContent.scrollHeight;
                }
                else if (msg.type === 'translation_partial') {
                    let el = document.getElementById(`trans-${msg.sentence_id}`);
                    if (!el) {
                        el = document.createElement('div');
                        el.className = 'sentence translation partial';
                        el.id = `trans-${msg.sentence_id}`;
                        transContent.appendChild(el);
                    }
                    el.textContent = msg.text;
                    transContent.scrollTop = transContent.scrollHeight;
                }
                else if (msg.type === 'translation_final') {
                    let el = document.getElementById(`trans-${msg.sentence_id}`);
                    if (!el) {
                        el = document.createElement('div');
                        el.className = 'sentence translation';
                        el.id = `trans-${msg.sentence_id}`;
                        transContent.appendChild(el);
                    } else {
                        el.className = 'sentence translation';
                    }
                    el.textContent = msg.text;
                    transContent.scrollTop = transContent.scrollHeight;
                }
                else if (msg.type === 'tts_ready') {
                    const transEl = document.getElementById(`trans-${msg.sentence_id}`);
                    if (transEl) {
                        const btn = document.createElement('button');
                        btn.className = 'audio-btn';
                        btn.textContent = '▶ Play';
                        btn.onclick = () => {
                            // Stop any currently playing audio before starting new one
                            if (window.currentAudio && !window.currentAudio.paused) {
                                window.currentAudio.pause();
                                window.currentAudio.currentTime = 0;
                            }
                            const audio = new Audio(`http://${location.hostname}:${location.port}${msg.audio_url}`);
                            audio.addEventListener('ended', () => {
                                if (window.currentAudio === audio) {
                                    window.currentAudio = null;
                                }
                            });
                            audio.play();
                            window.currentAudio = audio;
                            btn.textContent = '▶ Playing...';
                            audio.addEventListener('ended', () => {
                                btn.textContent = '▶ Play';
                            });
                        };
                        transEl.appendChild(btn);
                    }
                }
            };
        }

        connect();
    </script>
</body>
</html>
