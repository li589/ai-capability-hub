<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存储空间分析</title>
<style>
  :root {
    --ink: #1a1a2e;
    --sub: #6b7280;
    --muted: #9ca3af;
    --line: #e5e7eb;
    --surface: #f9fafb;
    --bg: #ffffff;
    --green: #059669;
    --green-bg: #ecfdf5;
    --amber: #d97706;
    --amber-bg: #fffbeb;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --radius-sm: 6px;
    --radius: 12px;
    --radius-lg: 16px;
    --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Pro SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f3f4f6; color: var(--ink); line-height: 1.6;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 260px; background: var(--bg); border-right: 1px solid var(--line);
    padding: 28px 0; position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .main { flex: 1; padding: 28px 36px 60px; max-width: 960px; }
  .sb-brand { padding: 0 24px 24px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .sb-brand h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .sb-brand span { font-size: 12px; color: var(--muted); display: block; margin-top: 4px; }
  .sb-nav { flex: 1; padding: 8px 12px; }
  .sb-nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: var(--radius-sm); font-size: 14px; color: var(--sub);
    text-decoration: none; transition: all var(--transition); margin-bottom: 2px;
  }
  .sb-nav a:hover { background: var(--surface); color: var(--ink); }
  .sb-nav a.active { background: var(--blue-bg); color: var(--blue); font-weight: 500; }
  .sb-nav .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sb-nav .count { margin-left: auto; font-size: 12px; color: var(--muted); }
  .sb-footer { padding: 16px 24px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  .page-header { margin-bottom: 28px; }
  .page-header h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .page-header p { color: var(--sub); font-size: 14px; margin-top: 4px; }
  .disk-card {
    background: var(--bg); border-radius: var(--radius-lg);
    padding: 24px 28px; margin-bottom: 28px;
    border: 1px solid var(--line);
  }
  .disk-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .disk-label { font-size: 13px; color: var(--sub); font-weight: 500; }
  .disk-label strong { color: var(--ink); font-size: 15px; }
  .disk-meter-bar {
    height: 20px; border-radius: 10px; background: var(--line); overflow: hidden;
    display: flex;
  }
  .disk-meter-bar span { display: block; height: 100%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .disk-meter-bar span + span { border-left: 2px solid #fff; }
  .disk-stats { display: flex; gap: 32px; margin-top: 12px; }
  .disk-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .disk-stat-value { font-size: 18px; font-weight: 600; }
  .disk-legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; }
  .disk-legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
  .disk-legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .tier-card {
    background: var(--bg); border-radius: var(--radius);
    padding: 20px; border: 1px solid var(--line);
    cursor: pointer; transition: all var(--transition);
  }
  .tier-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
  .tier-card .tier-icon { font-size: 24px; margin-bottom: 8px; }
  .tier-card .tier-count { font-size: 12px; color: var(--muted); }
  .tier-card .tier-size { font-size: 22px; font-weight: 600; margin: 4px 0; }
  .tier-card .tier-action { font-size: 12px; color: var(--sub); margin-top: 8px; }
  .section { margin-bottom: 32px; }
  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .section-header h3 { font-size: 16px; font-weight: 600; }
  .section-header .badge {
    font-size: 12px; padding: 2px 10px; border-radius: 20px; font-weight: 500;
  }
  .section-header .actions { margin-left: auto; display: flex; gap: 8px; }
  .item-card {
    background: var(--bg); border-radius: var(--radius);
    border: 1px solid var(--line); margin-bottom: 10px;
    overflow: hidden; transition: all var(--transition);
  }
  .item-card.green { border-left: 3px solid var(--green); }
  .item-card.amber { border-left: 3px solid var(--amber); }
  .item-card.red { border-left: 3px solid var(--red); }
  .item-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .item-card.cleaned { opacity: 0.55; }
  .item-card.cleaned .item-title { text-decoration: line-through; }
  .item-card.batch-cleaning .item-title::after {
    content: ' 清理中…'; color: var(--green); font-size: 12px; font-weight: 400;
  }
  .item-card.batch-ok .item-title::after {
    content: ' ✓'; color: var(--green); font-size: 14px; font-weight: 600;
  }
  .item-card.batch-fail .item-title::after {
    content: ' ✗'; color: var(--red); font-size: 14px; font-weight: 600;
  }
  .item-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; cursor: pointer; user-select: none;
  }
  .item-head:hover { background: var(--surface); }
  .item-icon { font-size: 18px; flex-shrink: 0; opacity: 0.7; }
  .item-info { flex: 1; min-width: 0; }
  .item-title { font-size: 14px; font-weight: 500; }
  .item-path {
    font-family: "SF Mono", "Cascadia Code", ui-monospace, monospace;
    font-size: 11px; color: var(--muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-size { font-weight: 600; font-size: 14px; white-space: nowrap; flex-shrink: 0; }
  .item-chevron {
    font-size: 10px; color: var(--muted); flex-shrink: 0;
    transition: transform var(--transition);
  }
  .item-card.open .item-chevron { transform: rotate(90deg); }
  .item-body { display: none; padding: 0 20px 18px; }
  .item-card.open .item-body { display: block; }
  .item-field { margin-top: 12px; }
  .item-field-label { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .item-field-value { font-size: 13px; color: var(--ink); line-height: 1.7; }
  .item-risk {
    background: var(--red-bg); border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 13px; color: var(--red);
    margin-top: 12px; line-height: 1.6;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 16px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer;
    transition: all var(--transition); text-decoration: none;
  }
  .btn:hover { background: var(--surface); border-color: #d1d5db; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.success { background: var(--green-bg); color: var(--green); border-color: #a7f3d0; }
  .btn.success:hover { background: #d1fae5; }
  .btn.danger { background: var(--red-bg); color: var(--red); border-color: #fecaca; }
  .btn.danger:hover { background: #fee2e2; }
  .btn.amber { background: var(--amber-bg); color: var(--amber); border-color: #fde68a; }
  .btn.amber:hover { background: #fef3c7; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-lg { padding: 10px 24px; font-size: 15px; font-weight: 600; border-radius: var(--radius); }
  .status-ok { color: var(--green); font-size: 12px; font-weight: 500; }
  .status-err { color: var(--red); font-size: 12px; }
  .summary-card {
    background: var(--bg); border-radius: var(--radius-lg);
    padding: 24px 28px; border: 1px solid var(--line);
  }
  .summary-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .summary-card ol { padding-left: 20px; }
  .summary-card li { margin: 8px 0; font-size: 14px; line-height: 1.7; }
  .summary-card .long-term { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .summary-card .long-term h4 { font-size: 13px; color: var(--sub); margin-bottom: 8px; }
  .summary-card .long-term ul { padding-left: 20px; list-style: disc; }
  .summary-card .long-term li { font-size: 13px; color: var(--sub); margin: 4px 0; }
  .summary-card .long-term code {
    font-family: "SF Mono", "Cascadia Code", ui-monospace, monospace;
    font-size: 12px; background: var(--surface); padding: 1px 5px; border-radius: 3px;
    border: 1px solid var(--line);
  }
  .cmd-block {
    background: #1e293b; border-radius: var(--radius-sm);
    padding: 12px 16px; margin-top: 4px; position: relative;
    font-family: "SF Mono", "Cascadia Code", ui-monospace, monospace;
    font-size: 12px; color: #e2e8f0; line-height: 1.7;
    overflow-x: auto; white-space: pre;
  }
  .cmd-block .cmd-copy {
    position: absolute; top: 8px; right: 8px;
    background: #334155; border: none; border-radius: 4px;
    padding: 3px 10px; font-size: 11px; color: #cbd5e1;
    cursor: pointer; font-family: inherit;
  }
  .cmd-block .cmd-copy:hover { background: #475569; color: #fff; }
  .cmd-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .action-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .warn-banner {
    background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--radius);
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: #92400e;
  }
  .warn-banner strong { color: #78350f; }

  /* ── 一键清理确认面板 ── */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.45); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 200ms;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg); border-radius: var(--radius-lg);
    width: 560px; max-width: 92vw; max-height: 85vh;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    display: flex; flex-direction: column;
    transform: translateY(20px); transition: transform 200ms;
  }
  .modal-overlay.active .modal { transform: translateY(0); }
  .modal-header {
    padding: 20px 24px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .modal-header h3 { font-size: 16px; font-weight: 600; flex: 1; }
  .modal-header .modal-close {
    background: none; border: none; font-size: 20px; color: var(--muted);
    cursor: pointer; padding: 4px 8px; border-radius: 4px;
  }
  .modal-header .modal-close:hover { background: var(--surface); color: var(--ink); }
  .modal-body { padding: 16px 24px; overflow-y: auto; flex: 1; }
  .modal-footer {
    padding: 16px 24px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .modal-footer .modal-footer-left { flex: 1; }
  .modal-footer .modal-footer-right { display: flex; gap: 8px; }

  /* 确认面板内的清理项列表 */
  .clean-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    margin-bottom: 6px; transition: background var(--transition);
  }
  .clean-item:hover { background: var(--surface); }
  .clean-item input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--green); cursor: pointer; flex-shrink: 0;
  }
  .clean-item-info { flex: 1; min-width: 0; }
  .clean-item-name { font-size: 13px; font-weight: 500; }
  .clean-item-path {
    font-family: "SF Mono", "Cascadia Code", ui-monospace, monospace;
    font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .clean-item-size { font-size: 13px; font-weight: 600; color: var(--green); white-space: nowrap; }
  .clean-item-status { font-size: 12px; margin-left: 4px; }
  .clean-item-status.cleaning { color: var(--amber); }
  .clean-item-status.ok { color: var(--green); font-weight: 500; }
  .clean-item-status.fail { color: var(--red); }

  /* 进度条 */
  .progress-bar {
    height: 6px; background: var(--line); border-radius: 3px;
    margin: 12px 0; overflow: hidden;
  }
  .progress-bar .progress-fill {
    height: 100%; background: var(--green); border-radius: 3px;
    transition: width 300ms ease; width: 0%;
  }
  .progress-text { font-size: 12px; color: var(--sub); }

  /* 结果摘要 */
  .result-summary {
    padding: 12px 16px; border-radius: var(--radius-sm);
    margin-top: 12px; font-size: 13px; line-height: 1.7;
  }
  .result-summary.success { background: var(--green-bg); color: var(--green); }
  .result-summary.partial { background: var(--amber-bg); color: var(--amber); }
  .result-summary.failed { background: var(--red-bg); color: var(--red); }

  /* 全选/取消全选 */
  .select-all-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; margin-bottom: 8px;
    border-bottom: 1px solid var(--line); font-size: 13px; color: var(--sub);
  }
  .select-all-row input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--green); cursor: pointer;
  }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { padding: 20px 16px 40px; }
    .tier-grid { grid-template-columns: 1fr; }
    .modal { width: 96vw; max-height: 90vh; }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .item-card { animation: fadeInUp 0.3s ease backwards; }
  .item-card:nth-child(1) { animation-delay: 0.02s; }
  .item-card:nth-child(2) { animation-delay: 0.04s; }
  .item-card:nth-child(3) { animation-delay: 0.06s; }
  .item-card:nth-child(4) { animation-delay: 0.08s; }
  .item-card:nth-child(5) { animation-delay: 0.10s; }
  .item-card:nth-child(6) { animation-delay: 0.12s; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-brand">
      <h1>存储空间分析</h1>
      <span id="sb-meta"></span>
    </div>
    <nav class="sb-nav">
      <a href="#overview" class="active" data-section="overview">&#9632; 总览</a>
      <a href="#green" data-section="green"><span class="dot" style="background:var(--green)"></span> 可自动清理 <span class="count" id="nav-green-count"></span></a>
      <a href="#amber" data-section="amber"><span class="dot" style="background:var(--amber)"></span> 需人工判断 <span class="count" id="nav-amber-count"></span></a>
      <a href="#red" data-section="red"><span class="dot" style="background:var(--red)"></span> 建议卸载 <span class="count" id="nav-red-count"></span></a>
      <a href="#summary" data-section="summary">&#9733; 总结建议</a>
    </nav>
    <div class="sb-footer">storage-analyzer · 只读分析</div>
  </aside>
  <main class="main" id="app-root"></main>
</div>

<!-- 一键清理确认面板 -->
<div class="modal-overlay" id="batch-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="batch-modal-title">确认清理</h3>
      <button class="modal-close" onclick="closeBatchModal()">&times;</button>
    </div>
    <div class="modal-body" id="batch-modal-body">
      <!-- 动态填充：清理项列表 + 进度条 + 结果 -->
    </div>
    <div class="modal-footer" id="batch-modal-footer">
      <div class="modal-footer-left">
        <span class="progress-text" id="batch-progress-text"></span>
      </div>
      <div class="modal-footer-right" id="batch-footer-btns">
        <!-- 动态填充：取消/确认按钮 -->
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="__report_data__">__REPORT_DATA__</script>
<script type="application/json" id="__delete_config__">__DELETE_CONFIG__</script>
<script>
// ── 安全 JSON 解析：从 <script type="application/json"> 读取，用 JSON.parse 解析 ──
// 设计说明：不把 JSON 直接赋值为 JS 表达式（DATA = {json}），因为 JSON 合法字符
// 如 U+2028/U+2029 会导致 JS 语法错误，某些内嵌浏览器也无法处理大内联 JSON。
// 改用 <script type="application/json"> + JSON.parse()，彻底隔离数据与代码。
var DATA, DELETE;
try {
  DATA = JSON.parse(document.getElementById('__report_data__').textContent);
} catch(e) {
  DATA = {};
  console.error('Failed to parse report data:', e);
}
try {
  var cfgEl = document.getElementById('__delete_config__');
  DELETE = cfgEl ? JSON.parse(cfgEl.textContent) : null;
} catch(e) {
  DELETE = null;
  console.error('Failed to parse delete config:', e);
}

// ── 数据归一化：确保缺失字段有安全默认值，防止空白页 ──
(function normalize() {
  DATA.system = DATA.system || {};
  DATA.system.os = DATA.system.os || '未知';
  DATA.system.build = DATA.system.build || '';
  DATA.system.user = DATA.system.user || '';
  DATA.system.arch = DATA.system.arch || '';
  DATA.system.disk_name = DATA.system.disk_name || 'C:';
  DATA.system.disk_total = DATA.system.disk_total || '0 GB';
  DATA.system.disk_used = DATA.system.disk_used || '0 GB';
  DATA.system.disk_free = DATA.system.disk_free || '0 GB';
  DATA.system.disks = DATA.system.disks || [];

  // FIX: amber → yellow 兼容（Agent 可能写 amber 而非 yellow）
  if (!Array.isArray(DATA.yellow) && Array.isArray(DATA.amber)) {
    DATA.yellow = DATA.amber;
  }
  if (!Array.isArray(DATA.green) && Array.isArray(DATA.green_items)) {
    DATA.green = DATA.green_items;
  }

  DATA.green = Array.isArray(DATA.green) ? DATA.green : [];
  DATA.yellow = Array.isArray(DATA.yellow) ? DATA.yellow : [];
  DATA.red = Array.isArray(DATA.red) ? DATA.red : [];

  // FIX: 逐项字段补全，防止渲染时 undefined 导致空白
  DATA.green.forEach(function(it) {
    it.name = it.name || it.path || '未命名';
    it.path = it.path || '';
    it.size_estimate = it.size_estimate || it.size || it.size_h || '';
    it.kill_processes = Array.isArray(it.kill_processes) ? it.kill_processes : [];
    it.trash_paths = Array.isArray(it.trash_paths) ? it.trash_paths : [];
    it.commands = Array.isArray(it.commands) ? it.commands : [];
  });
  DATA.yellow.forEach(function(it) {
    it.name = it.name || it.path || '未命名';
    it.path = it.path || '';
    it.size = it.size || it.size_estimate || '';
    it.content_profile = it.content_profile || '暂无内容画像';
    it.why_manual = it.why_manual || '需人工判断是否清理';
    it.disposal = it.disposal || '请手动检查后决定';
    it.risk = it.risk || '删除前请确认数据重要性';
    it.trash_paths = Array.isArray(it.trash_paths) ? it.trash_paths : [];
  });
  DATA.red.forEach(function(it) {
    it.name = it.name || it.path || '未命名';
    it.path = it.path || '';
    it.size = it.size || it.size_estimate || '';
    it.why_keep = it.why_keep || '建议通过系统卸载流程处理';
    it.indirect_release = it.indirect_release || '设置→应用→搜索应用名→卸载';
    it.app_paths = Array.isArray(it.app_paths) ? it.app_paths : [];
  });

  DATA.denied = Array.isArray(DATA.denied) ? DATA.denied : [];
  DATA.top5 = Array.isArray(DATA.top5) ? DATA.top5 : [];
  DATA.summary = DATA.summary || {};
  DATA.summary.tier_stats = DATA.summary.tier_stats || {};
  DATA.summary.tier_stats.green = DATA.summary.tier_stats.green || '0 GB';
  DATA.summary.tier_stats.yellow = DATA.summary.tier_stats.yellow || DATA.summary.tier_stats.amber || '0 GB';
  DATA.summary.tier_stats.red = DATA.summary.tier_stats.red || '0 GB';
  DATA.summary.overview = DATA.summary.overview || '';
  DATA.summary.priority = Array.isArray(DATA.summary.priority) ? DATA.summary.priority : [];
  DATA.summary.long_term = Array.isArray(DATA.summary.long_term) ? DATA.summary.long_term : [];
  DATA.generated_at = DATA.generated_at || '';
  DATA.scan_seconds = DATA.scan_seconds || '';
})();

function parseGB(s) {
  var m = String(s||'').match(/([\d.]+)\s*(TB|GB|MB)/i);
  if (!m) return 0;
  var v = parseFloat(m[1]);
  if (m[2].toUpperCase()==='TB') v*=1024;
  else if (m[2].toUpperCase()==='MB') v/=1024;
  return v;
}

  var ts = sm ? sm.tier_stats : null;
  var g = ts ? parseGB(ts.green) : 0;
  var y = ts ? parseGB(ts.yellow) : 0;
  var r = ts ? parseGB(ts.red) : 0;
  var other = Math.max(0, used - g - y - r);

  function seg(v, bg, title) {

function doDelete(btn, mode) {
  if (!DELETE) return;
  var wrap = btn.closest('.action-row');
  var status = wrap.querySelector('.del-status');
  var paths = JSON.parse(decodeURIComponent(escape(atob(wrap.dataset.paths))));
  var verb = mode==='rm' ? '直接删除（不可恢复）' : '移到废纸篓（可逆）';
  if (!confirm('确认'+verb+'以下 '+paths.length+' 个路径？\n\n'+paths.join('\n'))) return;
  status.textContent = '处理中…';
  fetch(DELETE.endpoint, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:DELETE.token, paths:paths, mode:mode})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.ok){ status.textContent='OK'; status.className='status-ok del-status';
        wrap.querySelectorAll('button').forEach(function(b){b.remove();});
        var card = wrap.closest('.item-card'); if(card) card.classList.add('cleaned');
      } else { status.textContent='✗ '+(res.error||'失败'); status.className='status-err del-status'; }
    }).catch(function(e){ status.textContent='✗ '+e; status.className='status-err del-status'; });
}

function doOpen(path) {
  if (!DELETE) return;
  fetch(DELETE.endpoint, {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:DELETE.token, paths:[path], mode:'open'})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(!res.ok) alert('打开失败：'+(res.error||'未知错误'));
    }).catch(function(e){ alert('打开失败：'+e); });
}

/**
 * 执行批量清理：串行逐项删除 + 实时进度
 */
async function executeBatchClean(mode) {
  var items = getCleanableGreenItems();
  // 收集勾选项
  var selected = [];
  document.querySelectorAll('.batch-checkbox').forEach(function(cb) {
    if (cb.checked) {
      var idx = parseInt(cb.dataset.batchIdx);
      selected.push(items[idx]);
    }
  });

  if (!selected.length) { alert('请至少选择一项'); return; }

  var verb = mode === 'rm' ? '直接删除' : '移到废纸篓';
  var total = selected.length;
  var okCount = 0;
  var failCount = 0;
  var failItems = [];

  // 禁用按钮
  document.getElementById('batch-btn-trash').disabled = true;
  document.getElementById('batch-btn-rm').disabled = true;
  document.getElementById('batch-btn-cancel').disabled = true;

  // 显示进度条
  var progressBar = document.getElementById('batch-progress-bar');
  var progressFill = document.getElementById('batch-progress-fill');
  var progressDetail = document.getElementById('batch-progress-detail');
  progressBar.style.display = 'block';

  // 禁用所有复选框
  document.querySelectorAll('.batch-checkbox').forEach(function(cb) { cb.disabled = true; });
  document.getElementById('batch-select-all').disabled = true;

  // 逐项串行删除
  for (var i = 0; i < selected.length; i++) {
    var it = selected[i];
    var statusEl = document.getElementById('batch-status-' + it.idx);
    var cardEl = document.getElementById('green-' + it.idx);

    // 更新进度
    progressFill.style.width = ((i / total) * 100) + '%';
    progressDetail.textContent = verb + '中… ' + (i + 1) + '/' + total;

    // 标记正在清理
    if (statusEl) { statusEl.textContent = '清理中…'; statusEl.className = 'clean-item-status cleaning'; }
    if (cardEl) { cardEl.classList.add('batch-cleaning'); }

    try {
      var res = await fetch(DELETE.endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token: DELETE.token, paths: it.trash_paths, mode: mode})
      });
      var data = await res.json();

      if (data.ok) {
        okCount++;
        if (statusEl) { statusEl.textContent = '✓'; statusEl.className = 'clean-item-status ok'; }
        if (cardEl) { cardEl.classList.remove('batch-cleaning'); cardEl.classList.add('batch-ok', 'cleaned'); }
      } else {
        failCount++;
        failItems.push(it.name + ': ' + (data.error || '未知错误'));
        if (statusEl) { statusEl.textContent = '✗'; statusEl.className = 'clean-item-status fail'; }
        if (cardEl) { cardEl.classList.remove('batch-cleaning'); cardEl.classList.add('batch-fail'); }
      }
    } catch (e) {
      failCount++;
      failItems.push(it.name + ': ' + e);
      if (statusEl) { statusEl.textContent = '✗'; statusEl.className = 'clean-item-status fail'; }
      if (cardEl) { cardEl.classList.remove('batch-cleaning'); cardEl.classList.add('batch-fail'); }
    }
  }

  // 进度条满
  progressFill.style.width = '100%';

  // 结果摘要
  var summaryEl = document.getElementById('batch-result-summary');
  if (failCount === 0) {
    summaryEl.innerHTML = '<div class="result-summary success">&#10003; 全部完成！成功' + verb + ' ' + okCount + ' 项</div>';
    progressDetail.textContent = verb + '完成！';
  } else if (okCount > 0) {
    summaryEl.innerHTML = '<div class="result-summary partial">&#9888; 部分完成：成功 ' + okCount + ' 项，失败 ' + failCount + ' 项' +
      '<br><strong>失败原因：</strong><br>' + failItems.join('<br>') + '</div>';
    progressDetail.textContent = '部分完成';
  } else {
    summaryEl.innerHTML = '<div class="result-summary failed">&#10007; 全部失败' +
      '<br><strong>失败原因：</strong><br>' + failItems.join('<br>') + '</div>';
    progressDetail.textContent = verb + '失败';
  }

  // 启用关闭按钮
  document.getElementById('batch-btn-cancel').disabled = false;
  document.getElementById('batch-btn-cancel').textContent = '关闭';

  // 移除确认按钮
  document.getElementById('batch-btn-trash').style.display = 'none';
  document.getElementById('batch-btn-rm').style.display = 'none';
}

document.addEventListener('click', function(e){
  var b = e.target.closest('.cmd-copy');
  if (!b) return;
  e.stopPropagation();
  var text = decodeURIComponent(escape(atob(b.dataset.cmd)));
  navigator.clipboard.writeText(text).then(function(){
    b.textContent = '已复制';
    setTimeout(function(){b.textContent='复制';},1500);
  });
});

// 点击遮罩关闭面板
document.getElementById('batch-modal').addEventListener('click', function(e) {
  if (e.target === this) closeBatchModal();
});

// Mount - 带错误保护，防止任意渲染函数崩溃导致空白页
(function mount() {
  try {
    var sm = DATA.summary;
    var warnings = [];

    // FIX: 结构诊断 — 检查关键字段是否存在
    if (!DATA.green.length && !DATA.yellow.length && !DATA.red.length) {
      warnings.push('⚠️ 未检测到 green/yellow/red 任何一项数据。如果 Agent 写了 "amber" 而非 "yellow"，数据可能丢失。');
    }
    if (DATA.green.some(function(it){return !it.size_estimate && !it.size;})) {
      warnings.push('⚠️ 部分 🟢 项缺少 size_estimate 字段，大小可能显示为空。');
    }
    if (DATA.yellow.some(function(it){return !it.content_profile || !it.why_manual;})) {
      warnings.push('⚠️ 部分 🟡 项缺少 content_profile 或 why_manual 字段。');
    }
    // 显示 build_report.py 传入的结构警告
    if (Array.isArray(DATA._warnings) && DATA._warnings.length) {
      DATA._warnings.forEach(function(w){ warnings.push('⚠️ ' + w); });
    }

    document.getElementById('sb-meta').textContent = '扫描于 '+DATA.generated_at+' · '+DATA.scan_seconds+'s';
    document.getElementById('nav-green-count').textContent = DATA.green.length;
    document.getElementById('nav-amber-count').textContent = DATA.yellow.length;
    document.getElementById('nav-red-count').textContent = DATA.red.length;
    document.getElementById('app-root').innerHTML =
      (warnings.length ? '<div class="warn-banner"><strong>数据结构提示：</strong><br>'+warnings.join('<br>')+'</div>' : '') +
      renderDiskOverview() +
      renderTierCards() +
      renderPriority() +
      renderSection('green','可自动清理',DATA.green,renderGreenItem) +
      renderSection('amber','需人工判断',DATA.yellow,renderAmberItem) +
      renderSection('red','建议卸载',DATA.red,renderRedItem) +
      renderSummary();
  } catch(e) {
    document.getElementById('app-root').innerHTML =
      '<div class="disk-card" style="text-align:center;padding:60px 20px">'+
      '<div style="font-size:48px;margin-bottom:16px">&#9888;</div>'+
      '<h3 style="margin-bottom:8px">报告渲染异常</h3>'+
      '<p style="color:var(--sub);font-size:14px;margin-bottom:16px">分析数据结构不匹配，请检查 JSON 字段名是否符合模板要求。</p>'+
      '<details style="text-align:left;margin-top:12px"><summary style="cursor:pointer;color:var(--muted);font-size:12px">调试信息</summary>'+
      '<pre style="background:var(--surface);padding:12px;border-radius:6px;font-size:11px;overflow:auto;margin-top:8px;text-align:left">'+
      esc(e.message||String(e))+'\n\n'+esc(e.stack||'')+'</pre></details>'+
      '<details style="text-align:left;margin-top:12px"><summary style="cursor:pointer;color:var(--muted);font-size:12px">原始数据（前 2000 字符）</summary>'+
      '<pre style="background:var(--surface);padding:12px;border-radius:6px;font-size:11px;overflow:auto;margin-top:8px;text-align:left;max-height:300px">'+
      esc(JSON.stringify(DATA).substring(0,2000))+'</pre></details></div>';
    console.error('Report render error:', e);
  }
})();
</script>
</body>
</html>
