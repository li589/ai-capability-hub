<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="64" y="64" width="896" height="896" rx="192" fill="url(#bg)"/>

  <!-- 外层光晕圆环 -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="24"/>

  <!-- 内部代码/节流核心图形 -->
  <g transform="translate(512,512)">
    <!-- 左括号 -->
    <path d="M-160,-120 L-220,0 L-160,120" fill="none" stroke="white" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <!-- 右括号 -->
    <path d="M160,-120 L220,0 L160,120" fill="none" stroke="white" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- 中间硬币/Token 图形 -->
    <circle cx="0" cy="0" r="90" fill="url(#accent)" filter="url(#glow)"/>
    <text x="0" y="28" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="90" font-weight="700" fill="#0f172a">T</text>

    <!-- 箭头表示压缩/减半 -->
    <path d="M-80,-180 L0,-220 L80,-180" fill="none" stroke="url(#accent)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-220" x2="0" y2="-150" stroke="url(#accent)" stroke-width="32" stroke-linecap="round"/>
  </g>

  <!-- 底部装饰小点 -->
  <circle cx="260" cy="760" r="24" fill="rgba(255,255,255,0.25)"/>
  <circle cx="340" cy="800" r="16" fill="rgba(255,255,255,0.15)"/>
</svg>
