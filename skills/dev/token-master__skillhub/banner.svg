<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1260" width="2400" height="1260">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="2400" height="1260" fill="url(#bg2)"/>

  <!-- 装饰网格 -->
  <g opacity="0.08" stroke="white" stroke-width="2">
    <line x1="0" y1="180" x2="2400" y2="180"/>
    <line x1="0" y1="360" x2="2400" y2="360"/>
    <line x1="0" y1="540" x2="2400" y2="540"/>
    <line x1="0" y1="720" x2="2400" y2="720"/>
    <line x1="0" y1="900" x2="2400" y2="900"/>
    <line x1="0" y1="1080" x2="2400" y2="1080"/>
    <line x1="300" y1="0" x2="300" y2="1260"/>
    <line x1="600" y1="0" x2="600" y2="1260"/>
    <line x1="900" y1="0" x2="900" y2="1260"/>
    <line x1="1200" y1="0" x2="1200" y2="1260"/>
    <line x1="1500" y1="0" x2="1500" y2="1260"/>
    <line x1="1800" y1="0" x2="1800" y2="1260"/>
    <line x1="2100" y1="0" x2="2100" y2="1260"/>
  </g>

  <!-- 左侧图标 -->
  <g transform="translate(280,630) scale(1.3)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="18"/>
    <path d="M-80,-60 L-110,0 L-80,60" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <path d="M80,-60 L110,0 L80,60" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <circle cx="0" cy="0" r="55" fill="url(#accent2)"/>
    <text x="0" y="18" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#0f172a">T</text>
  </g>

  <!-- 主标题 -->
  <text x="640" y="560" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="140" font-weight="800" fill="white">Token-Efficient Dev</text>

  <!-- 副标题 -->
  <text x="640" y="700" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="400" fill="#94a3b8">AI 编程 Token 成本控制规范</text>

  <!-- 卖点标签 -->
  <g transform="translate(640,820)">
    <rect x="0" y="0" width="260" height="72" rx="36" fill="url(#accent2)"/>
    <text x="130" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600" fill="#0f172a">功能不变</text>

    <rect x="300" y="0" width="260" height="72" rx="36" fill="url(#purple)"/>
    <text x="430" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600" fill="white">质量不降</text>

    <rect x="600" y="0" width="260" height="72" rx="36" fill="url(#accent2)"/>
    <text x="730" y="48" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="600" fill="#0f172a">Token 减半</text>
  </g>

  <!-- 底部装饰 -->
  <text x="2320" y="1200" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="500" fill="#475569">SkillHub · Pay Skill</text>
</svg>
